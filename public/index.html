<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local REST API Explorer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-table@1.22.1/dist/bootstrap-table.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<style>
body { background-color: #fff; padding: 0; }
header {
  background-color: #0070ba;
  background-image: linear-gradient(100deg, #0070ba, #1546a0);
}
header a, header a:hover { color: #fff; }
.container-fluid { padding-right: 15px; padding-left: 15px; }

:root { --my-orange: orange; }
.badge-orange { color: white; background-color: var(--my-orange); }
.btn-outline-orange { color: var(--my-orange); border-color: var(--my-orange); }
.btn-outline-orange:hover, .btn-outline-orange:not(:disabled):not(.disabled):active,
.btn-outline-orange:not(:disabled):not(.disabled).active {
  color: white; background-color: var(--my-orange); border-color: var(--my-orange);
}
.btn-outline-orange:focus { box-shadow: 0 0 0 0.2rem rgba(255,193,7,0.5); }

.btn { margin-left: 10px; }
.btn-xsm { height: 27px; padding: 2px 6px; margin: 2px 2px; margin-bottom: 2px; font-size: 85%; }
pre .btn-xsm { font-size: 13.6px; }
a.btn-xsm { margin-right: .25rem; }

table { font-size: 11pt; }
#tableResults th { font-size: 90%; }

.selectall { -webkit-user-select: all; -ms-user-select: all; user-select: all; }
.nowrap { white-space: nowrap; }
.text-break-all { word-break: break-all; }
a.resourceLink { cursor: zoom-in; }

pre:not(.btn), div.formattedDataContainer { font-size: 12px; }
pre:not(.btn) { border: 1px solid lightgrey; border-radius: 9px; padding: 4px; }
pre:not(.btn), div.prelike { margin-bottom: 6px; }
pre button.btn { font-family: var(--font-family-sans-serif); }

code {
  font-size: 12px; font-variant-ligatures: none; line-height: 1.5;
  tab-size: 4; word-wrap: break-word; white-space: pre-wrap; word-break: normal;
  background-color: #f6f6f6; border: 1px solid #e2e2e2; border-radius: 3px;
  color: rgb(224,30,90) !important; padding: 2px 3px 1px;
}

.headers-container pre, pre.requestbody, pre.responsebody {
  white-space: pre-wrap; overflow-wrap: anywhere;
}

.modal-body { padding: 0; padding-left: 15px; padding-right: 5px; overflow-y: auto; }
.modal-footer { padding: 0.2rem; }
.modal-dialog { top: 22px; margin-top: 0; margin-bottom: 10px; max-width: 80% !important; }
.modal-header { display: block !important; padding: 7px !important; }
.modal-body { max-height: calc(100vh - 125px); overflow-y: auto; background-color: ghostwhite; }

.clientidlink, .clientidlink:hover {
  z-index: 1; font-size: 70%; color: #bbb; vertical-align: -3px; user-select: all;
}

button[name="clearSearch"] { margin-left: 0; margin-right: -8px; }
.bootstrap-table input.search-input { min-width: 220px; text-align: right; }

.table-hover tbody tr:hover { background-color: rgba(0,0,0,0.040); }
.table-striped tbody tr:nth-of-type(odd) { background-color: rgba(0,0,0,0.040); }

.cursor-s { cursor: s-resize !important; }
.cursor-nw { cursor: nw-resize !important; }

.pseudo-focus-shadow { border-color: #80bdff; box-shadow: 0 0 0 0.2rem rgba(0,123,255,0.25); }

pre a:hover:not(.badge):not(.btn):not(.dropdown-item) {
  text-decoration: underline !important; text-decoration-style: dotted !important;
}

a.dottedhover { text-decoration-style: dotted; }
a:hover { color: currentColor; }
.nounderline, .nounderline:hover { text-decoration: none; }

#humantime {
  font-size: 98%; float: right; display: block; margin-top: 2px; margin-bottom: -2px;
  background-color: transparent; height: 26px; color: black; padding: 2px; border: none;
}

#expandAllContainer {
  position: fixed !important; top: unset !important; bottom: 5px !important;
  width: 100%; margin-left: -67px;
}
#expandAllContainer .btn-outline-light { color: #ddd; }

#summary-bar { margin: 12px 0; text-align: center; }

.fixed-table-pagination {
  position: sticky; top: 0; z-index: 10;
  background-color: #fff; padding: 4px 0;
  box-shadow: 0 4px 8px -2px rgba(0,0,0,0.15);
}

/* Exclude filter */
#exclude-section { display: inline-block; vertical-align: middle; margin-left: 18px; }
#exclude-input { width: 180px; height: 28px; font-size: 85%; padding: 2px 6px; display: inline-block; vertical-align: middle; }
#exclude-add-btn { height: 28px; padding: 2px 8px; font-size: 85%; vertical-align: middle; margin-left: 4px; }
#exclude-pills { margin-top: 4px; min-height: 0; }
#exclude-pills:empty { display: none; }
.exclude-pill {
  display: inline-flex; align-items: center; gap: 4px;
  background-color: #e9ecef; border: 1px solid #ced4da; border-radius: 12px;
  padding: 1px 8px 1px 4px; margin: 2px 4px 2px 0; font-size: 84%; color: #333;
  white-space: nowrap;
}
.exclude-pill.inactive { opacity: 0.5; background-color: #f8f9fa; text-decoration: line-through; }
.exclude-pill input[type="checkbox"] { margin: 0 2px 0 0; cursor: pointer; }
.exclude-pill-remove {
  cursor: pointer; color: #999; font-weight: bold; font-size: 110%;
  margin-left: 2px; line-height: 1; padding: 0 2px;
}
.exclude-pill-remove:hover { color: #c00; }
#exclude-clear-all { font-size: 84%; margin-left: 6px; cursor: pointer; color: #007bff; }
#exclude-clear-all:hover { text-decoration: underline; }

tr.pie-highlight {
  background-color: rgba(0, 123, 255, 0.12) !important;
  transition: background-color 0.15s ease;
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/moment-timezone@0.5.43/builds/moment-timezone-with-data.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap-table@1.22.1/dist/bootstrap-table.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

<script>
/* ── Globals ── */
var tableItems = [];
var rawData, fmtData;
var spansDays = false;
var ianaTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Los_Angeles';
var apiHistoryEnv = 'live';
moment.tz.setDefault(ianaTimezone);

var allLoadedData = [];
var excludePatterns = [];

var EXPAND_ALL_LABEL = '<span class="fa fa-plus"></span> all';
var COLLAPSE_ALL_LABEL = '<span class="fa fa-minus"></span>';

var PIE_COLORS = [
  '#4e79a7','#f28e2b','#e15759','#76b7b2','#59a14f',
  '#edc948','#b07aa1','#ff9da7','#9c755f','#bab0ac',
  '#86bcb6','#d37295'
];
var _pieCharts = {};

/* ── CSV download utility ── */
function downloadCsv(filename, headers, rows) {
  function escCell(val) {
    var s = String(val == null ? '' : val);
    if (s.indexOf('"') !== -1 || s.indexOf(',') !== -1 || s.indexOf('\n') !== -1) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }
  var lines = [headers.map(escCell).join(',')];
  rows.forEach(function(row) { lines.push(row.map(escCell).join(',')); });
  var blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

/* ── Exclude filter functions ── */
function getFilteredData() {
  var activePatterns = excludePatterns.filter(function(p) { return p.active; });
  if (!activePatterns.length) return allLoadedData.slice();
  return allLoadedData.filter(function(row) {
    var str = JSON.stringify(row);
    for (var i = 0; i < activePatterns.length; i++) {
      if (str.indexOf(activePatterns[i].text) !== -1) return false;
    }
    return true;
  });
}

function applyExclusions() {
  var $table = $('#tableResults');
  if ($table.length) {
    try { $table.bootstrapTable('destroy'); } catch(e) {}
  }
  renderTable(getFilteredData());
}

function addExcludePattern(text) {
  text = (text || '').trim();
  if (!text) return;
  /* Avoid duplicates */
  for (var i = 0; i < excludePatterns.length; i++) {
    if (excludePatterns[i].text === text) return;
  }
  excludePatterns.push({ text: text, active: true });
  renderExcludePills();
  applyExclusions();
}

function removeExcludePattern(index) {
  excludePatterns.splice(index, 1);
  renderExcludePills();
  applyExclusions();
}

function toggleExcludePattern(index) {
  excludePatterns[index].active = !excludePatterns[index].active;
  renderExcludePills();
  applyExclusions();
}

function renderExcludePills() {
  var html = '';
  excludePatterns.forEach(function(p, i) {
    var cls = 'exclude-pill' + (p.active ? '' : ' inactive');
    html += '<span class="' + cls + '">';
    html += '<input type="checkbox" class="exclude-pill-check" data-index="' + i + '"' + (p.active ? ' checked' : '') + '>';
    html += '<span>' + $('<span>').text(p.text).html() + '</span>';
    html += '<span class="exclude-pill-remove" data-index="' + i + '">&times;</span>';
    html += '</span>';
  });
  if (excludePatterns.length) {
    html += '<span id="exclude-clear-all">Clear All</span>';
  }
  $('#exclude-pills').html(html);
}

function clearAllExclusions() {
  excludePatterns = [];
  renderExcludePills();
  applyExclusions();
}

/* ── Formatting functions ── */

function formatCreateTime(req_time, row, index) {
  var fmt_time = req_time;
  if (req_time.indexOf("Z") > -1 || req_time.indexOf("GMT") > -1 || req_time.indexOf("UTC") > -1) {
    fmt_time = moment.utc(req_time).tz(ianaTimezone).format(
      (spansDays ? '[<span style="font-size:85%; color:#bbb;">]MM-DD[</span>] ' : '') +
      '[<span class="text-muted" style="font-weight:bold;">]HH:mm[</span>][<span style="color:#bbb; font-size:85%">]:ss[</span>]'
    );
  }
  return '<div title="' + moment.utc(req_time).tz(ianaTimezone).format("YYYY-MM-DD HH:mm:ss z") +
    '" class="text-muted" style="display:block; margin-left:0; margin-right:0px; font-size:95%; white-space:nowrap;">' + fmt_time + '</div>';
}

function formatCreateTimeTz(req_time, tz) {
  var obj = { full: req_time, tz: '', humanreadable: '' };
  if (req_time.indexOf("Z") > -1 || req_time.indexOf("GMT") > -1 || req_time.indexOf("UTC") > -1) {
    obj.full = moment.utc(req_time).tz(tz).format("YYYY-MM-DD HH:mm:ss z");
    obj.tz = moment.utc(req_time).tz(tz).format("z");
    obj.humanreadable = moment.utc(req_time).tz(tz).format("MMMM Do HH:mm z");
  }
  return obj;
}

function formatUrl(value, row, index) {
  var url = row['url'];
  var reLongId = /\/(?=.*[A-Z])(?=.*[\d])[A-Za-z\d=_-]{40,}/;
  if (reLongId.test(url)) {
    url = url.replace(/(\/(?=.*[A-Z])(?=.*[\d])[A-Za-z\d=_-]{20})([A-Za-z\d=_-]*)/, function(match, p1) {
      return p1 + '...';
    });
  }
  return '<a class="url text-break-all resourceLink" href="javascript:void(0);">' + url + '</a>';
}

function formatMethod(value, row, index) {
  value = String(value).toUpperCase();
  var tag;
  if (value.includes('POST')) tag = '<span class="text-muted">';
  else if (value.includes('GET')) tag = '<span class="text-muted">';
  else tag = '<span style="color:brown;">';
  return tag + value + '</span>';
}

function formatStatus(value, row, index) {
  return '<span style="font-size:110%; display:block; margin:-2px;">' + formatHTTPStatus(row['api_response']['status']) + '</span>';
}

function formatHTTPStatus(status) {
  try {
    status = parseInt(status);
    if (status >= 500) return '<span style="padding:0 1px; color:red; font-size:100%; font-weight:normal;">' + status + '</span>';
    else if (status >= 400) return '<span style="color:orange; font-size:100%; font-weight:normal;">' + status + '</span>';
    else return '<span style="color:green; font-size:100%; font-weight:normal;">' + status + '</span>';
  } catch (e) { return String(status); }
}

function getResourceId(value, row) {
  if (!value) try { value = row.resource_id; } catch (e) {}
  if (!value) try { value = row.api_request.body.id; } catch (e) {}
  if (!value) try { value = row.api_response.body.sale_id; } catch (e) {}
  if (!value) try { value = row.api_response.body.id; } catch (e) {}
  if (!value) try { value = row.api_response.body.token_id; } catch (e) {}
  if (!value) try { value = row.api_response.body.parent_payment; } catch (e) {}
  if (!value) try { value = row.correlation_id; } catch (e) {}
  return value;
}

function resourceSorterFunc(val1, val2, row1, row2) {
  var a = getResourceId(val1, row1) || '';
  var b = getResourceId(val2, row2) || '';
  return (a < b) ? -1 : (a > b) ? 1 : 0;
}

function formatCorrId(value, row, index) {
  var cid = row.correlation_id || '';
  if (!cid || cid === 'xxxxxx') return '<span class="text-muted" style="font-size:85%;">' + cid + '</span>';
  return '<span class="text-muted selectall text-monospace" style="font-size:85%;">' + cid + '</span>';
}

function formatResource(value, row, index) {
  var rid = String(getResourceId(value, row, index));
  var fSize = rid.length > 20 ? 75 : 90;
  var cls = rid.length > 26 ? 'text-break-all' : 'nowrap';
  return '<span class="' + cls + ' text-muted selectall" style="display:block; font-size:' + fSize + '%;">' + rid + '</span>';
}

function formatDuration(value) {
  try {
    var seconds = parseInt(value) / 1000;
    if (isNaN(seconds)) return value;
    return seconds.toFixed(1);
  } catch (e) { return value; }
}

function fmtJson(jsondata) {
  return (typeof jsondata !== 'undefined') ? JSON.stringify(jsondata, undefined, 4) : 'empty';
}

function fmtParam(p) { return '<span class="hljs-attr">' + p + '</span>'; }
function fmtValue(v) { return '<span class="hljs-string">' + v + '</span>'; }

function convertGMTtoTime(dateInString) {
  var fullDate = dateInString, tz;
  if (dateInString.indexOf("GMT") > -1) {
    fullDate = moment.utc(dateInString, "ddd, DD MMM YYYY HH:mm:ss ZZ").tz(ianaTimezone).format("ddd, DD MMM YYYY HH:mm:ss z");
    tz = '-' + moment.utc(dateInString, "ddd, DD MMM YYYY HH:mm:ss ZZ").tz(ianaTimezone).format("z");
  }
  return { fullDate: fullDate, tz: tz };
}

/* ── Copy dropdown ── */
function getCopyDropdown(corrId) {
  if (!corrId || corrId === 'xxxxxx') return '';
  var b = '<div data-corrid="' + corrId + '" class="dropdown copybuttondropdown">';
  b += '<button class="btn btn-sm btn-outline-primary dropdown-toggle" type="button" style="position:absolute; right:10px;top:10px;" data-toggle="dropdown">';
  b += '<i class="fa fa-clipboard" style="position:relative;top:1px;"></i> <span class="dropdownlabel">Copy</span></button>';
  b += '<div style="padding:0; margin:0; font-family:var(--font-family-sans-serif);" class="dropdown-menu">';
  b += '<a data-corrid="' + corrId + '" class="dropdown-item copy-data copy-email" style="padding:2px;margin:1px;text-align:center;" href="javascript:void(0);">For Email/Messaging</a>';
  b += '<a data-corrid="' + corrId + '" class="dropdown-item copy-data copy-rawrequest" style="padding:2px;margin:1px;text-align:center;" href="javascript:void(0);">Request only</a>';
  b += '<a data-corrid="' + corrId + '" class="dropdown-item copy-data copy-rawresponse" style="padding:2px;margin:1px;text-align:center;" href="javascript:void(0);">Response only</a>';
  b += '</div></div>';
  return b;
}

function copyData(event) {
  event.preventDefault();
  var $this = $(this);
  var corrId = $this.data('corrid');
  var row;
  tableItems.forEach(function(v) { if (v.correlation_id == corrId) { row = v; } });
  if (!row) return;

  var req_body = row.api_request.body;
  var res_body = row.api_response.body;
  var data;
  var EOL = '\n';

  if ($this.hasClass('copy-rawrequest')) data = fmtJson(req_body);
  else if ($this.hasClass('copy-rawresponse')) data = fmtJson(res_body);
  else if ($this.hasClass('copy-email')) {
    data = 'Event ' + (row.correlation_id || '') + ' on ' + formatCreateTimeTz(row.create_time, ianaTimezone).full + EOL;
    data += 'Request to ' + row.url + EOL + EOL;
    data += req_body ? fmtJson(req_body) : '(empty body)';
    data += EOL + EOL + 'PayPal response: ' + EOL + EOL;
    data += fmtJson(res_body);
  }

  try {
    var label = $this.parent().parent().find('.dropdownlabel');
    navigator.clipboard.writeText(data).then(function() {
      label.text('Copied.');
    }, function() { label.text('Clipboard failure'); });
  } catch (e) { console.log(e); }
}

/* ── Detail view (inline expand) ── */
function formatDetailView(index, row) {
  return getFormattedData(index, row, false);
}

function getFormattedData(index, row, isModal) {
  var dHtml = '<div style="position:relative;">';
  var req = row.api_request;
  var res = row.api_response;
  var accNum = row.account_number;
  var clientId = row.client_id;
  var corrId = row.correlation_id;

  if (navigator.clipboard && navigator.clipboard.writeText) dHtml += getCopyDropdown(corrId);

  var showHeadersStr = corrId;
  if (showHeadersStr === 'xxxxxx') showHeadersStr = 'Headers';

  var btnClass = isModal ? 'btn-outline-secondary' : 'btn-outline-light';
  dHtml += '<button class="btn btn-xsm ' + btnClass + ' actionbutton showHeaders cursor-s" style="font-family:var(--font-family-monospace);float:left;margin-top:4px; margin-left:3px; margin-right:8px; margin-bottom:5px;">' + showHeadersStr + '</button>';

  var reqTimeObj = formatCreateTimeTz(row.create_time, ianaTimezone);

  if (isModal) {
    var displayClientId = (clientId && clientId.length > 20) ? clientId.slice(0, 4) + '...' + clientId.slice(-6) : clientId;
    var userAgent = row.api_request && row.api_request.header ? row.api_request.header['user-agent'] : null;

    /* Resource pills */
    var resourceId = getResourceId(null, row);
    var pill_class = "badge badge-pill badge-info ml-1 text-white";
    var pills = '';
    var tags = [resourceId].concat(row.tag_id || []);
    var seen = {};
    tags.forEach(function(tag) {
      if (!tag || tag === 'xxxxxx' || tag === '*****' || seen[tag]) return;
      seen[tag] = true;
      var wrapClass = (tag.length < 39) ? 'nowrap' : 'text-break-all';
      pills += '<span class="' + pill_class + ' ' + wrapClass + '" style="font-size:90%; padding-top:4px; padding-bottom:2px;">' + tag + '</span>';
    });

    dHtml += '<div class="prelike text-wrap" style="float:left;">';
    dHtml += '<b></b>' + row.url + pills + '<br/>';
    dHtml += '<b>Method</b><span style="font-size:70%;"> </span><span style="color:#888">' + req.method + '</span>';
    dHtml += '<span style="font-weight:bold;vertical-align:8%"> | </span>';
    dHtml += '<b>Status</b><span style="font-size:60%;"> </span><span style="font-size:110%;vertical-align:-2%">' + formatHTTPStatus(res.status) + '</span>';
    dHtml += '<span style="font-weight:bold;vertical-align:8%"> | </span>';
    dHtml += '<span style="color:#888;">' + reqTimeObj.full + '</span>';

    var reqTimeObjLocal = formatCreateTimeTz(row.create_time, ianaTimezone);
    dHtml += '</div>';
  } else {
    var duration;
    if (res.duration_time && res.duration_time !== 'xxxxxx') duration = res.duration_time;
    dHtml += '<div style="margin-top:10px;margin-left:10px;">';
    if (duration) dHtml += '<span style="font-family:var(--font-family-sans-serif); font-size:115%;">' + formatDuration(duration) + '</span><span class="text-muted" style="font-family:var(--font-family-sans-serif)"> seconds response time</span>';
    dHtml += '</div>';
  }

  dHtml += '<div style="clear:both;"/>';

  /* Headers (collapsed by default) */
  var req_header = req.header || {};
  dHtml += '<div style="display:none;" class="headers-container">';
  dHtml += '<div style="display:table-cell; vertical-align:middle;"><div style="display:inline-block;padding-bottom:2px;padding-top:5px;"><b>client_id:</b></div> <div style="display:inline; margin:0; color:#888">' + (clientId || '') + '</div></div><div style="clear:both;"></div>';
  dHtml += '<b>Request headers</b><br/><pre class="requestheader jsoncode plaintext" style="overflow-x:hidden;">';
  for (var rp in req_header) {
    dHtml += fmtParam(rp) + ': ' + fmtValue(req_header[rp]) + '<br/>';
  }
  dHtml += '</pre>';

  var res_header = res.header || {};
  dHtml += '<b>Response headers</b><br/><pre class="responseheader jsoncode plaintext" style="overflow-x:hidden;">';
  for (var sp in res_header) {
    if (sp === "Date") {
      var ptDate = convertGMTtoTime(res_header[sp]);
      dHtml += fmtParam(sp) + ': ' + fmtValue(ptDate.fullDate) + '<br/>';
    } else {
      dHtml += fmtParam(sp) + ': ' + fmtValue(res_header[sp]) + '<br/>';
    }
  }
  dHtml += '</pre></div>';

  /* Request body */
  var req_body = req.body;
  dHtml += '<b>Request ';
  if (isModal) {
    dHtml += 'body </b>';
    var userAgent2 = row.api_request && row.api_request.header ? row.api_request.header['user-agent'] : null;
    if (userAgent2) {
      if (/Mozilla/i.test(userAgent2)) {
        dHtml += '<span style="color:orange;">from a browser: </span><span style="color:#bbb;">' + userAgent2 + '</span>';
      } else {
        dHtml += '<span style="color:#bbb; font-style:italic;">' + userAgent2 + '</span>';
      }
    }
  } else {
    dHtml += '</b>';
  }
  dHtml += '<br/><pre class="requestbody jsoncode" style="max-height:500px;">' + fmtJson(req_body) + '</pre>';

  /* Response body */
  dHtml += '<b>Response ' + (isModal ? 'body ' : '') + '</b><br/>';
  dHtml += '<pre class="responsebody jsoncode" style="max-height:500px;">' + fmtJson(res.body) + '</pre>';

  dHtml = '<pre>' + dHtml + '</pre></div>';
  return dHtml;
}

/* ── Syntax highlighting ── */
function addCustomHighlighting() {
  document.querySelectorAll('.jsoncode:not(.highlighted)').forEach(function(block) {
    hljs.highlightElement(block);
  });

  /* Highlight identifiers (PayPal IDs) in request/response bodies */
  document.querySelectorAll('pre.requestbody:not(.highlighted), pre.responsebody:not(.highlighted)').forEach(function(block) {
    block.innerHTML = highlightIdentifiers(block.innerHTML);
  });

  /* Detect enum/constant fields */
  var attrs = $('.jsoncode:not(.highlighted) span.hljs-attr');
  var enums = ['intent', 'status', 'landing_page', 'reason_code', 'protection_eligibility', 'disbursement_mode', 'carrier'];
  attrs.filter(function() {
    var txt = $(this).text();
    for (var i = 0; i < enums.length; i++) { if (txt.includes('"' + enums[i] + '"')) return true; }
    return false;
  }).each(function() {
    var value = $(this).next();
    if ($(this).text() === '"rel"') value.wrapInner('<span class="hljs-literal"/>');
    else {
      var valText = value.text().replace(/"|'/g, '');
      if (!['***', '*****', 'xxxxxx'].includes(valText)) value.wrapInner('<span class="hljs-keyword"/>');
    }
  });

  /* _type, _method, _action, _status fields */
  attrs.filter(function() { return /(_type|_method|_action|_status)("|')$/i.test($(this).text()); }).each(function() {
    var valueSpan = $(this).next();
    if (valueSpan.hasClass('hljs-attr')) return;
    var valText = valueSpan.text().replace(/"|'/g, '');
    if (!['***', '*****', 'xxxxxx'].includes(valText)) valueSpan.wrapInner('<span class="hljs-keyword"/>');
  });

  /* Detect UPPER_CASE constants */
  $('pre.requestbody:not(.highlighted), pre.responsebody:not(.highlighted)').find('span.hljs-string:contains("_")').each(function() {
    if ($(this).html().trim().match(/^"[A-Z,_]*"$/)) {
      var valText = $(this).text().replace(/"|'/g, '');
      if (!['***', '*****', 'xxxxxx'].includes(valText)) $(this).wrapInner('<span class="hljs-keyword"></span>');
    }
  });

  /* Numbers */
  $('pre.requestbody:not(.highlighted), pre.responsebody:not(.highlighted)').find('span.hljs-number').addClass("hljs-meta");

  /* Messages and error keys */
  var messageKeys = ['description', 'issue', 'message', 'name', 'type', 'error', 'error_description'];
  attrs.filter(function() {
    var txt = $(this).text();
    for (var i = 0; i < messageKeys.length; i++) { if (txt.includes('"' + messageKeys[i] + '"')) return true; }
    return false;
  }).each(function() {
    var valueSpan = $(this).next();
    if (valueSpan.hasClass('hljs-attr')) return;
    var valText = valueSpan.text().replace(/"|'/g, '');
    if (!['***', '*****', 'xxxxxx'].includes(valText)) valueSpan.wrapInner('<span class="hljs-keyword"></span>');
  });

  document.querySelectorAll('.jsoncode').forEach(function(block) {
    block.classList.add('highlighted');
  });
}

function highlightIdentifiers(jsondata) {
  try {
    /* PayPal IDs like EC-, PROD-, BA-, etc. */
    var ret = jsondata.replace(/((EC)|(PROD)|(BA)|(TEMP))-[A-Z\d]{17}/gm, function(s) {
      return '<span class="hljs-keyword"><span class="hljs-literal">' + s + '</span></span>';
    });
    /* Standard 17-char PayPal IDs */
    ret = ret.replace(/["/=]((?=.*[A-Z])(?=.*[\d])([A-Z\d]{17})|((?=.*[A-Z])(?=.*[\d])[A-Z\d]{13}))(["/\n &?]|$)/gm, function(match) {
      var smart = match.match(/(^[^A-Z0-9a-z]*)([A-Z0-9a-z-]*)(.*)/);
      if (smart && smart.length > 2) {
        return smart[1] + '<span class="hljs-keyword"><span class="hljs-literal">' + smart[2] + '</span></span>' + (smart[3] || '');
      }
      return match;
    });
    return ret;
  } catch (e) { return jsondata; }
}

/* ── Custom search ── */
function customTableSearch(data, text) {
  text = String(text).trim();
  return data.filter(function(row) {
    var strdata = JSON.stringify(row);
    return strdata.includes(text) || strdata.includes(text.replace(/\s+/gm, ''));
  });
}

/* ── Render table ── */
function renderTable(items) {
  tableItems = items;

  var has_success = 0, has_failure = 0, has_error = 0;
  items.forEach(function(v) {
    try {
      var val = parseInt(v.http_status);
      if (val >= 200 && val < 300) has_success++;
      else if (val >= 400 && val < 500) has_failure++;
      else if (val >= 500) has_error++;
    } catch (e) {}
  });

  /* Summary bar */
  var m_earliest = moment(items[items.length - 1].create_time);
  var m_latest = moment(items[0].create_time);
  var days = m_latest.diff(m_earliest, 'days');
  var hours = m_latest.diff(m_earliest, 'hours');
  var mins = m_latest.diff(m_earliest, 'minutes');
  var secs = m_latest.diff(m_earliest, 'seconds');
  spansDays = (days > 1);

  var summary = '';
  var excludedCount = allLoadedData.length - items.length;
  if (items.length === 1) summary = '1 event';
  else {
    summary = (excludedCount > 0 ? items.length + ' of ' + allLoadedData.length + ' events' : items.length + ' events') + ' spanning ';
    if (days) summary += days + ' days';
    else if (hours) summary += hours + ' hours';
    else if (mins) summary += mins + ' minutes';
    else summary += secs + ' seconds';
  }
  if (excludedCount > 0) summary += ' (' + excludedCount + ' excluded)';
  $('#summary-bar').html('<div class="alert alert-info" style="border-color:lightgrey; text-align:center; max-width:510px; margin:0 auto; margin-bottom:0;">' + summary + '</div>');

  /* Toolbar HTML */
  var has_multiple = (has_success && has_failure) || (has_success && has_error) || (has_failure && has_error);
  var out = '';
  if (has_multiple) {
    out += '<div id="tabletoolbar" class="btn-group btn-group-toggle" data-toggle="buttons">';
    if (has_success) out += '<label class="btn btn-m btn-outline-success" style="border-color:lightgrey;" data-filter-value=\'"http_status":2\'><input type="radio" name="options" autocomplete="off"> <span class="badge badge-success">' + has_success + '</span> Success</label>';
    if (has_failure) out += '<label class="btn btn-m btn-outline-orange" style="border-color:lightgrey;" data-filter-value=\'"http_status":4\'><input type="radio" name="options" autocomplete="off"> <span class="badge badge-orange">' + has_failure + '</span> Failed</label>';
    if (has_error)   out += '<label class="btn btn-m btn-outline-danger" style="border-color:lightgrey;" data-filter-value=\'"http_status":5\'><input type="radio" name="options" autocomplete="off"> <span class="badge badge-danger">' + has_error + '</span> Errors</label>';
    out += '</div>';
  }

  out += '<table class="table table-sm table-striped table-bordered table-hover" id="tableResults" ' +
    'data-pagination="true" data-detail-view="true" data-detail-formatter="formatDetailView" ' +
    'data-detail-view-by-click="false" data-detail-view-icon="true" ' +
    'data-buttons-class="outline-secondary" data-pagination-v-align="top" ' +
    'data-toolbar="#tabletoolbar" data-toolbar-align="right" ' +
    'data-page-size="100" data-page-list="[10, 15, 20, 50, 100]" ' +
    'data-search="true" data-custom-search="customTableSearch" ' +
    'data-show-search-clear-button="true" ' +
    'data-hover="true" data-striped="true" data-sort-name="create_time" data-sort-order="desc">' +
    '<thead><tr>' +
    '<th data-field="create_time" data-align="center" data-formatter="formatCreateTime" data-sortable="true" data-searchable="false">Timestamp</th>' +
    '<th data-field="url" data-align="left" data-formatter="formatUrl" data-sortable="true" data-events="clickUrlEvent">URL Path</th>' +
    '<th data-field="resource_id" data-align="center" data-formatter="formatResource" data-sortable="true" data-sorter="resourceSorterFunc">ID</th>' +
    '<th data-field="correlation_id" data-align="center" data-formatter="formatCorrId" data-sortable="true">Corr ID</th>' +
    '<th data-field="api_request.method" data-align="center" data-sortable="true" data-formatter="formatMethod">Method</th>' +
    '<th data-field="http_status" data-align="center" data-sortable="true" data-formatter="formatStatus">Status</th>' +
    '</tr></thead></table>';

  var container = document.getElementById('frmSearchResults');
  container.innerHTML = '';
  var p = document.createElement('p');
  p.innerHTML = out;
  container.appendChild(p);

  $('#tableResults').bootstrapTable({
    data: items,
    formatSearch: function() { return 'JSON / Raw Data search'; },
    onResetView: function() {
      if (!$('tr.detail-view').length) {
        $('#expandAllInnerText').html(EXPAND_ALL_LABEL);
      }
    },
    onExpandRow: function() {
      addCustomHighlighting();
      $('.showHeaders').unbind('click').click(toggleHeaders);
      $('a.copy-data').unbind('click').click(copyData);
    }
  });

  /* Expand all button */
  var expandAll = '<div id="expandAllContainer" class="btn-group-toggle" style="position:relative; top:46px;" data-toggle="buttons">' +
    '<label class="btn btn-sm btn-outline-light">' +
    '<input id="expandAll" type="checkbox" autocomplete="off"/> ' +
    '<span id="expandAllInnerText">' + EXPAND_ALL_LABEL + '</span>' +
    '</label></div>';
  $('.fixed-table-toolbar').prepend(expandAll);

  function asyncExpand(idx) {
    if ($('#expandAll').prop('checked')) {
      $('#tableResults').bootstrapTable('expandRow', idx);
    }
  }

  $('#expandAll').change(function() {
    if ($(this).prop('checked')) {
      $('tr[data-index]').each(function(i) {
        var idx = $(this).data('index');
        if (idx < 2) asyncExpand(idx);
        else $(document).ready(function() { asyncExpand(idx); });
      });
      $('#expandAllInnerText').html(COLLAPSE_ALL_LABEL);
    } else {
      $('#tableResults').bootstrapTable('collapseAllRows');
      $('#expandAllInnerText').html(EXPAND_ALL_LABEL);
    }
  });

  $('.bootstrap-table input.search-input').on('keyup change', function() {

    if (!curval.includes('http_status')) clearHttpFilters();
    else updateHttpFilters(curval);
  });

  $('.bootstrap-table .btn[name=clearSearch]').click(function() { clearHttpFilters(); });

  $('#tabletoolbar label.btn').click(function() {
    var searchInput = $('.bootstrap-table input.search-input').val($(this).data('filter-value'));
    updateHttpFilters(searchInput.val());
    searchInput.blur();
  });

  /* Raw data toggle in modal */
  $('#apiRawData').off('click').on('click', function() {
    showRawDetails();
    $(this).hide();
    $('#apiFmtData').show();
  });
  $('#apiFmtData').off('click').on('click', function() {
    showFmtDetails();
  });
}

function clearHttpFilters() {
  $('.bootstrap-table input.search-input').removeClass('pseudo-focus-shadow');
  $('#tabletoolbar label.btn').removeClass('active').find('input').prop('checked', false);
}

function updateHttpFilters(curval) {
  $('.bootstrap-table input.search-input').removeClass('pseudo-focus-shadow');
  $('#tabletoolbar label.btn').each(function() {
    var $this = $(this);
    var input = $this.find('input');
    if (curval == $this.data('filter-value')) {
      input.prop('checked', true);
      $this.addClass('active');
    } else {
      input.prop('checked', false);
      $this.removeClass('active');
    }
  });
}

function getApiHistoryUrl() {

/* ── Shared Pie Chart renderer ── */
function renderPieChart(opts) {
  var canvasId = opts.canvasId;
  var $container = opts.$container;
  var slices = opts.slices;

  /* Destroy prior instance */
  if (_pieCharts[canvasId]) {
    _pieCharts[canvasId].destroy();
    delete _pieCharts[canvasId];
  }

  var canvas = document.getElementById(canvasId);
  if (!canvas || !slices.length) return;

  var labels = slices.map(function(s) { return s.label; });
  var data = slices.map(function(s) { return s.value; });
  var colors = slices.map(function(s) { return s.color; });
  var total = data.reduce(function(a, b) { return a + b; }, 0);

  var chart = new Chart(canvas, {
    type: 'pie',
    data: {
      labels: labels,
      datasets: [{
        data: data,
        backgroundColor: colors,
        borderWidth: 1,
        borderColor: '#fff',
        hoverOffset: 12
      }]
    },
    options: {
      responsive: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              var v = ctx.parsed;
              var pct = total ? ((v / total) * 100).toFixed(1) : 0;
              return ctx.label + ': ' + v + ' (' + pct + '%)';
            }
          }
        }
      },
      onHover: function(event, elements) {
        /* Clear all highlights */
        $container.find('tr.pie-highlight').removeClass('pie-highlight');
        if (elements.length) {
          var idx = elements[0].index;
          $container.find('tr[data-slice-index="' + idx + '"]').addClass('pie-highlight');
        }
      }
    }
  });

  _pieCharts[canvasId] = chart;

  /* Table → Pie: mouseenter/mouseleave on data rows */
  $container.find('tr[data-slice-index]').on('mouseenter', function() {
    var idx = parseInt($(this).attr('data-slice-index'));
    chart.setActiveElements([{ datasetIndex: 0, index: idx }]);
    chart.tooltip.setActiveElements([{ datasetIndex: 0, index: idx }]);
    chart.update('none');
  }).on('mouseleave', function() {
    chart.setActiveElements([]);
    chart.tooltip.setActiveElements([]);
    chart.update('none');
  });
}

function openFilteredWindow(records, title) {

  var lookupBase = getApiHistoryUrl();

  var rows = '';
  records.forEach(function(r) {
    var ts = moment.utc(r.create_time).tz(ianaTimezone).format('YYYY-MM-DD HH:mm:ss z');
    var method = (r.api_request.method || '').toUpperCase();
    var status = parseInt(r.http_status || r.api_response.status);
    var statusColor = status >= 500 ? 'red' : status >= 400 ? 'orange' : 'green';
    var corrId = r.correlation_id || '';
    var issueList = '';
    try {
      var details = (r.api_response.body && r.api_response.body.details) || [];
      details.forEach(function(d) { if (d.issue) issueList += (issueList ? ', ' : '') + d.issue; });
    } catch(e) {}

    var reqBody = '';

    var resBody = '';
    try { resBody = r.api_response.body ? JSON.stringify(r.api_response.body, null, 2) : ''; } catch(e) {}

      '</tr>' +
      '<tr class="detail-row"><td colspan="6">' +
      '<details><summary style="cursor:pointer; color:#007bff; font-size:90%; margin-bottom:4px;">Request / Response</summary>' +
      '<b>Request body</b><pre style="background:#282c34; color:#abb2bf; padding:8px; border-radius:6px; font-size:12px; max-height:300px; overflow:auto;">' + esc(reqBody || 'empty') + '</pre>' +
      '<b>Response body</b><pre style="background:#282c34; color:#abb2bf; padding:8px; border-radius:6px; font-size:12px; max-height:300px; overflow:auto;">' + esc(resBody || 'empty') + '</pre>' +
      '</details></td></tr>';
  });

  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + title.replace(/</g,'&lt;') + '</title>' +
    '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">' +
    '<style>body{padding:20px;font-size:13px;} pre{white-space:pre-wrap;word-break:break-all;} tr.detail-row{background:#f8f9fa !important;} table{font-size:12px;} .corr-copy:hover{color:#007bff !important;} a[title="Look up in API History"]:hover{color:#007bff !important;}</style></head><body>' +
    '<h5>' + title.replace(/</g,'&lt;') + ' <span class="badge badge-secondary">' + records.length + ' record(s)</span></h5>' +
    '<table class="table table-sm table-bordered table-striped mt-3">' +
    '<thead class="thead-dark"><tr><th>Timestamp</th><th>URL</th><th>Corr ID</th><th>Method</th><th>Status</th><th>Issue(s)</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>' +
    '<script>document.addEventListener("click",function(e){var t=e.target.closest(".corr-copy");if(t){var id=t.getAttribute("data-corrid");navigator.clipboard.writeText(id).then(function(){t.textContent="\\u2713";setTimeout(function(){t.innerHTML="\\u2398";},800);});}});<\/script>' +
