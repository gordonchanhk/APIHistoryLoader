/* ── Error Analysis ── */
function showErrorAnalysis() {
  var errors = tableItems.filter(function(r) {
    var s = parseInt(r.http_status || r.api_response.status);
    return s >= 400;
  });

  /* Pre-scan: detect localhost in URL fields across ALL records */
  var localhostRe = /(^|\/)localhost(:\d+)?(\/|$)/i;
  var urlFieldNames = ['return_url', 'cancel_url', 'callback_url', 'notify_url', 'redirect_url', 'success_url', 'failure_url'];
  var localhostFindings = {};  /* fieldName -> { count, sampleValue, records: [] } */

  function scanForLocalhost(obj, row) {
    if (!obj || typeof obj !== 'object') return;
    if (Array.isArray(obj)) {
      obj.forEach(function(item) { scanForLocalhost(item, row); });
    } else {
      Object.keys(obj).forEach(function(key) {
        var val = obj[key];
        if (typeof val === 'string' && (urlFieldNames.indexOf(key) !== -1 || /_(url|uri)$/i.test(key))) {
          if (localhostRe.test(val)) {
            if (!localhostFindings[key]) localhostFindings[key] = { count: 0, sampleValue: val, records: [] };
            localhostFindings[key].count++;
            localhostFindings[key].records.push(row);
          }
        } else if (typeof val === 'object' && val !== null) {
          scanForLocalhost(val, row);
        }
      });
    }
  }

  tableItems.forEach(function(row) {
    scanForLocalhost(row.api_request ? row.api_request.body : null, row);
    scanForLocalhost(row.api_response ? row.api_response.body : null, row);
  });

  var localhostFields = Object.keys(localhostFindings).sort(function(a, b) {
    return localhostFindings[b].count - localhostFindings[a].count;
  });

  function buildLocalhostHtml() {
    if (!localhostFields.length) return '';
    var lhtml = '<hr style="margin:14px 0 10px;">';
    lhtml += '<p class="mb-2"><span class="fa fa-wrench" style="color:#e6a800; margin-right:3px;"></span> <strong>Potential Integration Issue</strong></p>';
    lhtml += '<table class="table table-sm table-bordered mb-0" style="font-size:93%; max-width:700px;">';
    lhtml += '<thead class="thead-light"><tr><th>Field</th><th>Sample Value</th><th style="text-align:center; width:70px;">Count</th></tr></thead><tbody>';

    localhostFields.forEach(function(field) {
      var f = localhostFindings[field];
      var escVal = f.sampleValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      lhtml += '<tr class="localhost-issue-row" style="cursor:pointer;" data-field="' + field.replace(/"/g,'&quot;') + '">';
      lhtml += '<td><code style="font-size:12px;">' + field + '</code></td>';
      lhtml += '<td><span style="font-size:12px; word-break:break-all; color:#e6a800;">' + escVal + '</span></td>';
      lhtml += '<td style="text-align:center;"><span class="font-weight-bold">' + f.count + '</span></td>';
      lhtml += '</tr>';
    });

    lhtml += '</tbody></table>';
    lhtml += '<p class="text-muted mt-1 mb-0" style="font-size:85%;"><code>localhost</code> URLs indicate a development/testing environment. Ensure production URLs are configured before going live. Click a row to view those records.</p>';
    return lhtml;
  }

  function bindLocalhostDrill() {
    $('#errorAnalysisContent').on('click', '.localhost-issue-row', function() {
      var field = $(this).data('field');
      var recs = localhostFindings[field] ? localhostFindings[field].records : [];
      if (!recs.length) return;
      openFilteredWindow(recs, 'Localhost in ' + field);
    });
  }

  if (!errors.length) {
    var noErrHtml = '<div class="alert alert-success mb-0">No error responses found in the loaded data.</div>';
    noErrHtml += buildLocalhostHtml();
    $('#errorAnalysisContent').html(noErrHtml);
    bindLocalhostDrill();
    $('#errorAnalysisModal').modal('show');
    return;
  }

  /* Count by HTTP status code */
  var statusCounts = {};
  errors.forEach(function(r) {
    var s = parseInt(r.http_status || r.api_response.status);
    statusCounts[s] = (statusCounts[s] || 0) + 1;
  });
  var statusSummary = Object.keys(statusCounts).sort().map(function(s) {
    return '<span class="text-danger font-weight-bold">' + s + '</span>&nbsp;(' + statusCounts[s] + ')';
  }).join(', ');

  /* Count by issue */
  var issueCounts = {};
  var issueDesc = {};
  errors.forEach(function(r) {
    var details = (r.api_response.body && r.api_response.body.details) || [];
    if (!details.length) {
      var status = parseInt(r.http_status || r.api_response.status);
      var name = (r.api_response.body && r.api_response.body.name) || '';
      var key = name ? status + ' ' + name : status + ' (no details)';
      issueCounts[key] = (issueCounts[key] || 0) + 1;
      if (r.api_response.body && r.api_response.body.message && !issueDesc[key]) issueDesc[key] = r.api_response.body.message;
    }
    details.forEach(function(d) {
      var issue = d.issue || '(unknown)';
      issueCounts[issue] = (issueCounts[issue] || 0) + 1;
      if (d.description && !issueDesc[issue]) issueDesc[issue] = d.description;
    });
  });

  /* Sort by count descending */
  var sorted = Object.keys(issueCounts).sort(function(a, b) {
    return issueCounts[b] - issueCounts[a];
  });

  var totalIssues = 0;
  sorted.forEach(function(k) { totalIssues += issueCounts[k]; });

  /* Build slice data for pie chart */
  var errorSliceData = [];

  var html = '<p class="mb-2"><strong>' + errors.length + '</strong> request(s) returned errors: ' + statusSummary + '</p>';
  html += '<div style="display:flex; gap:20px; align-items:flex-start;">';
  html += '<div style="flex:1; min-width:0;">';
  html += '<table class="table table-sm table-bordered table-striped mb-0" style="font-size:93%;">';
  html += '<thead class="thead-light"><tr><th style="width:40%;">Issue</th><th style="width:50%;">Description</th><th style="width:10%; text-align:center;">Count</th></tr></thead><tbody>';

  /* Group records by issue for drill-down */
  var issueRecords = {};
  errors.forEach(function(r) {
    var details = (r.api_response.body && r.api_response.body.details) || [];
    if (!details.length) {
      var key = '(no details)';
      if (!issueRecords[key]) issueRecords[key] = [];
      issueRecords[key].push(r);
    }
    details.forEach(function(d) {
      var issue = d.issue || '(unknown)';
      if (!issueRecords[issue]) issueRecords[issue] = [];
      issueRecords[issue].push(r);
    });
  });

  sorted.forEach(function(issue, idx) {
    var desc = issueDesc[issue] || '';
    var pct = ((issueCounts[issue] / totalIssues) * 100).toFixed(0);
    var sliceColor = PIE_COLORS[idx % PIE_COLORS.length];
    errorSliceData.push({ label: issue, value: issueCounts[issue], color: sliceColor });
    html += '<tr class="issue-row" style="cursor:pointer;" data-issue="' + issue.replace(/"/g,'&quot;') + '" data-slice-index="' + idx + '">';
    html += '<td><span style="display:inline-block;width:10px;height:10px;background:' + sliceColor + ';margin-right:5px;vertical-align:middle;border-radius:1px;"></span><code style="font-size:12px; word-break:break-all;">' + issue + '</code></td>';
    html += '<td class="text-muted" style="font-size:90%;">' + desc + '</td>';
    html += '<td style="text-align:center;"><span class="badge badge-danger">' + issueCounts[issue] + '</span> <span class="text-muted" style="font-size:80%;">' + pct + '%</span></td>';
    html += '</tr>';
  });

  html += '</tbody></table>';
  html += '<p class="text-muted mt-2 mb-0" style="font-size:85%;">Click a row to view its records in a new window.</p>';
  html += '</div>';
  html += '<div style="flex:0 0 220px; position:sticky; top:0;"><canvas id="pieChart_error" width="220" height="220"></canvas></div>';
  html += '</div>';

  html += buildLocalhostHtml();

  $('#errorAnalysisContent').html(html);

  renderPieChart({ canvasId: 'pieChart_error', $container: $('#errorAnalysisContent'), slices: errorSliceData });

  /* Drill-down click handler */
  $('#errorAnalysisContent .issue-row').on('click', function() {
    var issue = $(this).data('issue');
    var records = issueRecords[issue] || [];
    openFilteredWindow(records, 'Error: ' + issue);
  });

  bindLocalhostDrill();

  /* CSV export handler */
  $('#btnExportErrorCsv').off('click').on('click', function() {
    var csvRows = [];
    sorted.forEach(function(issue) {
      csvRows.push([issue, issueDesc[issue] || '', issueCounts[issue]]);
    });
    downloadCsv('error_analysis.csv', ['Issue', 'Description', 'Count'], csvRows);
  });

  $('#errorAnalysisModal').modal('show');
}

/* ── Endpoint Count ── */
function patternToRegex(pattern) {
  /* Pattern format: "METHOD /path" or just "/path".
     * matches any single path segment. */
  var parts = pattern.split(' ');
  var method = null, path;
  if (parts.length >= 2) { method = parts[0].toUpperCase(); path = parts.slice(1).join(' '); }
  else { path = parts[0]; }

  /* Escape regex special chars in path, then replace \* with [^/]+ */
  var escaped = path.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\\\*/g, '[^/]+');
  var re = new RegExp('^' + escaped + '$');
  return { method: method, regex: re, original: pattern };
}

function showEndpointCount() {
  $.getJSON('/api/patterns', function(patterns) {
    var matchers = patterns.map(patternToRegex);
    var counts = {};     /* pattern -> count */
    var successCounts = {}; /* pattern -> 2xx count */
    var failCounts = {};    /* pattern -> 4xx/5xx count */
    var unmatchedRows = [];

    patterns.forEach(function(p) { counts[p] = 0; successCounts[p] = 0; failCounts[p] = 0; });

    tableItems.forEach(function(row) {
      var rowMethod = (row.api_request.method || '').toUpperCase();
      var rowUrl = row.url || '';
      var status = parseInt(row.http_status || row.api_response.status);
      var matched = false;

      for (var i = 0; i < matchers.length; i++) {
        var m = matchers[i];
        if (m.method && m.method !== rowMethod) continue;
        if (m.regex.test(rowUrl)) {
          counts[m.original]++;
          if (status >= 200 && status < 300) successCounts[m.original]++;
          else failCounts[m.original]++;
          matched = true;
          break;
        }
      }
      if (!matched) unmatchedRows.push(row);
    });

    /* Build slice data for pie chart */
    var endpointSliceData = [];
    var endpointSliceIdx = 0;

    var html = '<p class="mb-2"><strong>' + tableItems.length + '</strong> total request(s) matched against <strong>' + patterns.length + '</strong> configured pattern(s):</p>';
    html += '<div style="display:flex; gap:20px; align-items:flex-start;">';
    html += '<div style="flex:1; min-width:0;">';
    html += '<table class="table table-sm table-bordered table-striped mb-0" style="font-size:93%;">';
    html += '<thead class="thead-light"><tr><th>Pattern</th><th style="text-align:center; width:80px;">Total</th><th style="text-align:center; width:80px;">Success</th><th style="text-align:center; width:80px;">Failed</th></tr></thead><tbody>';

    patterns.forEach(function(p) {
      var total = counts[p];
      if (total === 0) return;
      var sPct = total ? ((successCounts[p] / total) * 100).toFixed(0) : '0';
      var fPct = total ? ((failCounts[p] / total) * 100).toFixed(0) : '0';
      var sliceColor = PIE_COLORS[endpointSliceIdx % PIE_COLORS.length];
      endpointSliceData.push({ label: p, value: total, color: sliceColor });
      html += '<tr data-slice-index="' + endpointSliceIdx + '">';
      html += '<td><span style="display:inline-block;width:10px;height:10px;background:' + sliceColor + ';margin-right:5px;vertical-align:middle;border-radius:1px;"></span><code style="font-size:12px;">' + p + '</code></td>';
      html += '<td style="text-align:center;"><strong>' + total + '</strong></td>';
      html += '<td style="text-align:center;">' + (successCounts[p] ? '<span class="text-success">' + successCounts[p] + '</span> <span class="text-muted" style="font-size:80%;">' + sPct + '%</span>' : '<span class="text-muted">0</span>') + '</td>';
      html += '<td style="text-align:center;">' + (failCounts[p] ? '<span class="text-danger">' + failCounts[p] + '</span> <span class="text-muted" style="font-size:80%;">' + fPct + '%</span>' : '<span class="text-muted">0</span>') + '</td>';
      html += '</tr>';
      endpointSliceIdx++;
    });

    if (unmatchedRows.length) {
      var unmatchedColor = PIE_COLORS[endpointSliceIdx % PIE_COLORS.length];
      endpointSliceData.push({ label: '(unmatched)', value: unmatchedRows.length, color: unmatchedColor });
      html += '<tr class="table-warning" id="unmatchedRow" style="cursor:pointer;" data-slice-index="' + endpointSliceIdx + '"><td><span style="display:inline-block;width:10px;height:10px;background:' + unmatchedColor + ';margin-right:5px;vertical-align:middle;border-radius:1px;"></span><em>(unmatched)</em></td>';
      html += '<td style="text-align:center;"><strong>' + unmatchedRows.length + '</strong></td>';
      html += '<td style="text-align:center;" colspan="2"></td></tr>';
    }

    html += '</tbody></table>';
    html += '<p class="text-muted mt-2 mb-0" style="font-size:85%;">Patterns are configured in <code>server.js</code> &rarr; <code>API_PATTERNS</code> array.' +
      (unmatchedRows.length ? ' Click <em>(unmatched)</em> to view those records.' : '') + '</p>';
    html += '</div>';
    html += '<div style="flex:0 0 220px; position:sticky; top:0;"><canvas id="pieChart_endpoint" width="220" height="220"></canvas></div>';
    html += '</div>';

    $('#endpointCountContent').html(html);

    renderPieChart({ canvasId: 'pieChart_endpoint', $container: $('#endpointCountContent'), slices: endpointSliceData });

    if (unmatchedRows.length) {
      $('#unmatchedRow').on('click', function() {
        openFilteredWindow(unmatchedRows, 'Unmatched API Requests');
      });
    }

    /* CSV export handler */
    $('#btnExportEndpointCsv').off('click').on('click', function() {
      var csvRows = [];
      patterns.forEach(function(p) {
        if (counts[p] === 0) return;
        csvRows.push([p, counts[p], successCounts[p], failCounts[p]]);
      });
      if (unmatchedRows.length) {
        csvRows.push(['(unmatched)', unmatchedRows.length, '', '']);
      }
      downloadCsv('endpoint_count.csv', ['Pattern', 'Total', 'Success', 'Failed'], csvRows);
    });

    $('#endpointCountModal').modal('show');
  }).fail(function() {
    $('#endpointCountContent').html('<div class="alert alert-danger mb-0">Failed to load patterns from server.</div>');
    $('#endpointCountModal').modal('show');
  });
}

/* ── Client IDs ── */
function showClientIds() {
  var clientMap = {};  /* client_id -> { total, success, fail, successRecords, failRecords } */

  tableItems.forEach(function(row) {
    var cid = row.client_id || '(unknown)';
    if (!clientMap[cid]) clientMap[cid] = { total: 0, success: 0, fail: 0, successRecords: [], failRecords: [] };
    clientMap[cid].total++;
    var status = parseInt(row.http_status || row.api_response.status);
    if (status >= 200 && status < 300) { clientMap[cid].success++; clientMap[cid].successRecords.push(row); }
    else { clientMap[cid].fail++; clientMap[cid].failRecords.push(row); }
  });

  var cids = Object.keys(clientMap).sort(function(a, b) {
    return clientMap[b].total - clientMap[a].total;
  });

  /* Build slice data for pie chart */
  var clientSliceData = [];

  var html = '<p class="mb-2"><strong>' + cids.length + '</strong> distinct client ID(s) across <strong>' + tableItems.length + '</strong> request(s):</p>';
  html += '<div style="display:flex; gap:20px; align-items:flex-start;">';
  html += '<div style="flex:1; min-width:0;">';
  html += '<table class="table table-sm table-bordered table-striped mb-0" style="font-size:93%;">';
  html += '<thead class="thead-light"><tr><th>Client ID</th><th style="text-align:center; width:70px;">Total</th><th style="text-align:center; width:90px;">Success</th><th style="text-align:center; width:90px;">Failed</th></tr></thead><tbody>';

  cids.forEach(function(cid, idx) {
    var c = clientMap[cid];
    var sPct = c.total ? ((c.success / c.total) * 100).toFixed(0) : '0';
    var fPct = c.total ? ((c.fail / c.total) * 100).toFixed(0) : '0';
    var escCid = cid.replace(/"/g, '&quot;');
    var sliceColor = PIE_COLORS[idx % PIE_COLORS.length];
    clientSliceData.push({ label: cid.length > 20 ? cid.slice(0, 8) + '...' + cid.slice(-6) : cid, value: c.total, color: sliceColor });
    html += '<tr data-slice-index="' + idx + '">';
    html += '<td><span style="display:inline-block;width:10px;height:10px;background:' + sliceColor + ';margin-right:5px;vertical-align:middle;border-radius:1px;"></span><code style="font-size:11px; word-break:break-all; user-select:all;">' + cid + '</code>';
    if (cid !== '(unknown)') html += ' <span class="cid-copy" data-cid="' + escCid + '" title="Copy client ID" style="cursor:pointer; color:#888; font-size:14px;">&#x2398;</span>';
    html += '</td>';
    html += '<td style="text-align:center;"><strong>' + c.total + '</strong></td>';
    html += '<td style="text-align:center;">' + (c.success ? '<a href="javascript:void(0);" class="cid-drill text-success font-weight-bold" data-cid="' + escCid + '" data-outcome="success" style="text-decoration:none;">' + c.success + '</a> <span class="text-muted" style="font-size:80%;">' + sPct + '%</span>' : '<span class="text-muted">0</span>') + '</td>';
    html += '<td style="text-align:center;">' + (c.fail ? '<a href="javascript:void(0);" class="cid-drill text-danger font-weight-bold" data-cid="' + escCid + '" data-outcome="fail" style="text-decoration:none;">' + c.fail + '</a> <span class="text-muted" style="font-size:80%;">' + fPct + '%</span>' : '<span class="text-muted">0</span>') + '</td>';
    html += '</tr>';
  });

  html += '</tbody></table>';
  html += '<p class="text-muted mt-2 mb-0" style="font-size:85%;">Click a count to view those records in a new window.</p>';
  html += '</div>';
  html += '<div style="flex:0 0 220px; position:sticky; top:0;"><canvas id="pieChart_clients" width="220" height="220"></canvas></div>';
  html += '</div>';

  $('#clientIdsContent').html(html);

  renderPieChart({ canvasId: 'pieChart_clients', $container: $('#clientIdsContent'), slices: clientSliceData });

  /* Drill-down click handler */
  $('#clientIdsContent').on('click', '.cid-drill', function() {
    var cid = $(this).data('cid');
    var outcome = $(this).data('outcome');
    var recs = clientMap[cid] ? clientMap[cid][outcome + 'Records'] : [];
    if (!recs.length) return;
    var label = cid.length > 30 ? cid.slice(0, 10) + '...' + cid.slice(-10) : cid;
    var labels = { success: 'Success', fail: 'Failed' };
    openFilteredWindow(recs, labels[outcome] + ': ' + label);
  });

  /* Copy client ID */
  $('#clientIdsContent').on('click', '.cid-copy', function() {
    var el = $(this);
    var cid = el.data('cid');
    navigator.clipboard.writeText(cid).then(function() {
      el.html('&#x2713;');
      setTimeout(function() { el.html('&#x2398;'); }, 800);
    });
  });

  $('#clientIdsModal').modal('show');
}

/* ── Capture Analysis ── */
function showCaptureAnalysis() {
  var createOrderRe = /^\/v2\/checkout\/orders$/;
  var captureOrderRe = /^\/v2\/checkout\/orders\/([^\/]+)\/capture$/;
  var getOrderRe = /^\/v2\/checkout\/orders\/([^\/]+)$/;
  var authorizeOrderRe = /^\/v2\/checkout\/orders\/([^\/]+)\/authorize$/;
  var authCaptureRe = /^\/v2\/payments\/authorizations\/([^\/]+)\/capture$/;

  /* Build lookup: order ID → payment_source from order records */
  var orderPaymentSource = {};
  tableItems.forEach(function(row) {
    var method = ((row.api_request && row.api_request.method) || '').toUpperCase();
    var url = row.url || '';
    if (method !== 'GET' && method !== 'POST') return;

    var orderId = null;
    /* GET/POST /v2/checkout/orders/{id} — order ID is in the URL */
    var m = url.match(getOrderRe);
    if (m) orderId = m[1];
    /* POST /v2/checkout/orders/{id}/authorize — order ID is in the URL */
    if (!orderId) { var ma = url.match(authorizeOrderRe); if (ma) orderId = ma[1]; }
    /* POST /v2/checkout/orders — order ID is in the response body */
    if (!orderId && createOrderRe.test(url) && method === 'POST') {
      try { orderId = row.api_response.body.id; } catch(e) {}
    }

    if (!orderId || orderPaymentSource[orderId]) return;
    try {
      var ps = row.api_response.body.payment_source;
      if (ps) orderPaymentSource[orderId] = Object.keys(ps)[0];
    } catch(e) {}
  });

  /* Build lookup: authorization ID → order ID from authorize records */
  var authToOrder = {};
  tableItems.forEach(function(row) {
    var method = ((row.api_request && row.api_request.method) || '').toUpperCase();
    if (method !== 'POST') return;
    var m = (row.url || '').match(authorizeOrderRe);
    if (!m) return;
    var orderId = m[1];
    try {
      var authId = row.api_response.body.purchase_units[0].payments.authorizations[0].id;
      if (authId) authToOrder[authId] = orderId;
    } catch(e) {}
  });

  /* Count order creations (POST /v2/checkout/orders -> 2xx) */
  var totalOrderCreates = 0;
  tableItems.forEach(function(row) {
    var method = ((row.api_request && row.api_request.method) || '').toUpperCase();
    if (method !== 'POST') return;
    if (!createOrderRe.test(row.url || '')) return;
    var httpStatus = parseInt(row.http_status || (row.api_response && row.api_response.status));
    if (httpStatus >= 200 && httpStatus < 300) totalOrderCreates++;
  });

  var records = [];

  tableItems.forEach(function(row) {
    var method = ((row.api_request && row.api_request.method) || '').toUpperCase();
    if (method !== 'POST') return;

    var url = row.url || '';
    var isCreate = createOrderRe.test(url);
    var captureMatch = url.match(captureOrderRe);
    var isCapture = !!captureMatch;
    var authCaptureMatch = url.match(authCaptureRe);
    var isAuthCapture = !!authCaptureMatch;
    var authorizeMatch = url.match(authorizeOrderRe);
    var isAuthorize = !!authorizeMatch;
    if (!isCreate && !isCapture && !isAuthCapture && !isAuthorize) return;

    var httpStatus = parseInt(row.http_status || (row.api_response && row.api_response.status));
    var body = (row.api_response && row.api_response.body) || {};

    /* Try to get capture/authorize status */
    var captureStatus = null;
    if (isAuthCapture) {
      /* Auth-capture: status is at body top level */
      captureStatus = body.status || null;
    } else if (isAuthorize) {
      /* Authorize: check authorization status or treat HTTP error as failure */
      try { captureStatus = body.purchase_units[0].payments.authorizations[0].status; } catch(e) {}
    } else {
      try { captureStatus = body.purchase_units[0].payments.captures[0].status; } catch(e) {}
    }

    /* For order-create URLs, only include if captures data exists or if error */
    if (isCreate && !captureStatus && httpStatus >= 200 && httpStatus < 400) return;
    /* For authorize URLs, only include failures (successes are intermediate, not final) */
    if (isAuthorize && httpStatus >= 200 && httpStatus < 400 && captureStatus !== 'DENIED') return;

    /* Resolve order ID for per-order tracking */
    var orderId = null;
    if (isCapture && captureMatch[1]) orderId = captureMatch[1];
    else if (isAuthCapture && authCaptureMatch[1]) orderId = authToOrder[authCaptureMatch[1]] || null;
    else if (isAuthorize && authorizeMatch[1]) orderId = authorizeMatch[1];
    else if (isCreate) { try { orderId = body.id; } catch(e) {} }

    /* Get payment source type from response, fallback to request body */
    var paymentSource = null;
    try {
      var ps = body.payment_source;
      if (ps) paymentSource = Object.keys(ps)[0];
    } catch(e) {}
    if (!paymentSource) {
      try {
        var reqPs = row.api_request.body.payment_source;
        if (reqPs) paymentSource = Object.keys(reqPs)[0];
      } catch(e) {}
    }
    /* Fallback: look up payment source from related order record */
    if (!paymentSource && isCapture && captureMatch[1]) {
      paymentSource = orderPaymentSource[captureMatch[1]] || null;
    }
    if (!paymentSource && (isAuthCapture || isAuthorize) && orderId) {
      paymentSource = orderPaymentSource[orderId] || null;
    }

    /* Determine outcome */
    var outcome;
    if (httpStatus >= 400) outcome = 'failed';
    else if (captureStatus === 'COMPLETED') outcome = 'completed';
    else if (captureStatus === 'PENDING') outcome = 'pending';
    else if (captureStatus === 'DECLINED' || captureStatus === 'DENIED') outcome = 'failed';
    else return;

    records.push({
      row: row,
      paymentSource: paymentSource || '(unknown)',
      outcome: outcome,
      orderId: orderId,
      type: isCreate ? 'create' : (isAuthorize ? 'authorize' : (isAuthCapture ? 'auth-capture' : 'capture'))
    });
  });

  if (!records.length) {
    $('#captureAnalysisContent').html('<div class="alert alert-success mb-0">No capture transactions found in the loaded data.</div>');
    $('#captureAnalysisModal').modal('show');
    return;
  }

  /* Separate known vs unknown payment source records */
  var knownRecords = [];
  var unknownRecords = [];
  records.forEach(function(rec) {
    if (rec.paymentSource === '(unknown)') unknownRecords.push(rec);
    else knownRecords.push(rec);
  });

  /* Group known records by payment source */
  var sourceMap = {};
  var totals = { completed: 0, pending: 0, failed: 0, total: 0 };

  knownRecords.forEach(function(rec) {
    var src = rec.paymentSource;
    if (!sourceMap[src]) sourceMap[src] = { completed: 0, pending: 0, failed: 0, total: 0, completedRecords: [], pendingRecords: [], failedRecords: [] };
    sourceMap[src][rec.outcome]++;
    sourceMap[src].total++;
    sourceMap[src][rec.outcome + 'Records'].push(rec.row);
    totals[rec.outcome]++;
    totals.total++;
  });

  /* Sort by total descending */
  var sources = Object.keys(sourceMap).sort(function(a, b) {
    return sourceMap[b].total - sourceMap[a].total;
  });

  /* Group unknown records by error issue */
  var unknownIssueMap = {};  /* issue -> { count, records: [] } */
  unknownRecords.forEach(function(rec) {
    var issue = '(no details)';
    try {
      var body = rec.row.api_response.body;
      var details = body.details || [];
      if (details.length && details[0].issue) issue = details[0].issue;
      else if (body.name) issue = body.name;
    } catch(e) {}
    if (!unknownIssueMap[issue]) unknownIssueMap[issue] = { count: 0, records: [] };
    unknownIssueMap[issue].count++;
    unknownIssueMap[issue].records.push(rec.row);
  });
  var unknownIssues = Object.keys(unknownIssueMap).sort(function(a, b) {
    return unknownIssueMap[b].count - unknownIssueMap[a].count;
  });

  /* Failed capture reasons (all failed records, known + unknown) */
  var failIssueMap = {};  /* issue -> { count, records: [] } */
  records.forEach(function(rec) {
    if (rec.outcome !== 'failed') return;
    var issue = '(no details)';
    try {
      var body = rec.row.api_response.body;
      var details = body.details || [];
      if (details.length && details[0].issue) issue = details[0].issue;
      else if (body.name) issue = body.name;
    } catch(e) {}
    if (!failIssueMap[issue]) failIssueMap[issue] = { count: 0, records: [] };
    failIssueMap[issue].count++;
    failIssueMap[issue].records.push(rec.row);
  });
  var failIssues = Object.keys(failIssueMap).sort(function(a, b) {
    return failIssueMap[b].count - failIssueMap[a].count;
  });

  /* Per-order outcome tracking: find orders with both failed and completed */
  var orderOutcomeSet = {};  /* orderId -> Set-like { failed: bool, completed: bool } */
  var orderFailSuccessRecords = [];
  records.forEach(function(rec) {
    if (!rec.orderId) return;
    if (!orderOutcomeSet[rec.orderId]) orderOutcomeSet[rec.orderId] = { failed: false, completed: false, records: [] };
    if (rec.outcome === 'failed') orderOutcomeSet[rec.orderId].failed = true;
    if (rec.outcome === 'completed') orderOutcomeSet[rec.orderId].completed = true;
    orderOutcomeSet[rec.orderId].records.push(rec.row);
  });
  var failedAlsoSucceeded = 0;
  Object.keys(orderOutcomeSet).forEach(function(oid) {
    var o = orderOutcomeSet[oid];
    if (o.failed && o.completed) {
      failedAlsoSucceeded++;
      orderFailSuccessRecords = orderFailSuccessRecords.concat(o.records);
    }
  });

  /* Build slice data for pie chart */
  var captureSliceData = [];

  /* Build HTML */
  var knownCount = knownRecords.length;

  function pct(count, total) {
    if (!count || !total) return '';
    return ' <span class="text-muted" style="font-size:80%;">' + ((count / total) * 100).toFixed(0) + '%</span>';
  }

  function drillCell(count, total, src, outcome, colorClass, colorStyle) {
    if (!count) return '<span class="text-muted">0</span>';
    var esc = src.replace(/"/g, '&quot;');
    var style = 'text-decoration:none; cursor:pointer;' + (colorStyle ? ' color:' + colorStyle + ';' : '');
    var cls = 'capture-drill font-weight-bold' + (colorClass ? ' ' + colorClass : '');
    return '<a href="javascript:void(0);" class="' + cls + '" data-source="' + esc + '" data-outcome="' + outcome + '" style="' + style + '">' + count + '</a>' + pct(count, total);
  }

  /* Summary lines */
  var html = '<p class="mb-1" style="font-size:93%;">';
  html += '<span class="fa fa-shopping-cart text-muted" style="margin-right:3px;"></span> ';
  html += 'Orders created (<code>POST /v2/checkout/orders</code> &rarr; 2xx): <strong>' + totalOrderCreates + '</strong>';
  if (failedAlsoSucceeded > 0) {
    html += ' &nbsp;|&nbsp; <span class="fa fa-refresh" style="color:#17a2b8; margin-right:3px;"></span>';
    html += 'Orders with failed capture but also succeeded: ';
    html += '<a href="javascript:void(0);" class="fail-also-success-drill font-weight-bold" style="text-decoration:none; color:#17a2b8;">' + failedAlsoSucceeded + '</a>';
  }
  html += '</p>';

  /* Payment source table */
  html += '<p class="mb-2 mt-2"><strong>' + knownCount + '</strong> capture transaction(s) across <strong>' + sources.length + '</strong> payment source(s)' + (unknownRecords.length ? ' <span class="text-muted" style="font-size:85%;">(' + unknownRecords.length + ' with unknown source excluded)</span>' : '') + ':</p>';
  html += '<div style="display:flex; gap:20px; align-items:flex-start;">';
  html += '<div style="flex:1; min-width:0;">';
  html += '<table class="table table-sm table-bordered table-striped mb-0" style="font-size:93%;">';
  html += '<thead class="thead-light"><tr>';
  html += '<th>Payment Source</th>';
  html += '<th style="text-align:center; width:90px;">Completed</th>';
  html += '<th style="text-align:center; width:90px;">Pending</th>';
  html += '<th style="text-align:center; width:90px;">Failed</th>';
  html += '<th style="text-align:center; width:70px;">Total</th>';
  html += '</tr></thead><tbody>';

  sources.forEach(function(src, idx) {
    var s = sourceMap[src];
    var sliceColor = PIE_COLORS[idx % PIE_COLORS.length];
    captureSliceData.push({ label: src, value: s.total, color: sliceColor });
    html += '<tr data-slice-index="' + idx + '">';
    html += '<td><span style="display:inline-block;width:10px;height:10px;background:' + sliceColor + ';margin-right:5px;vertical-align:middle;border-radius:1px;"></span><code style="font-size:12px;">' + src + '</code></td>';
    html += '<td style="text-align:center;">' + drillCell(s.completed, s.total, src, 'completed', 'text-success') + '</td>';
    html += '<td style="text-align:center;">' + drillCell(s.pending, s.total, src, 'pending', '', '#e6a800') + '</td>';
    html += '<td style="text-align:center;">' + drillCell(s.failed, s.total, src, 'failed', 'text-danger') + '</td>';
    html += '<td style="text-align:center;"><strong>' + s.total + '</strong></td>';
    html += '</tr>';
  });

  /* Totals row */
  html += '<tr class="table-secondary font-weight-bold">';
  html += '<td>Total</td>';
  html += '<td style="text-align:center;" class="text-success">' + totals.completed + pct(totals.completed, totals.total) + '</td>';
  html += '<td style="text-align:center; color:#e6a800;">' + totals.pending + pct(totals.pending, totals.total) + '</td>';
  html += '<td style="text-align:center;" class="text-danger">' + totals.failed + pct(totals.failed, totals.total) + '</td>';
  html += '<td style="text-align:center;">' + totals.total + '</td>';
  html += '</tr>';

  html += '</tbody></table>';
  html += '<p class="text-muted mt-2 mb-0" style="font-size:85%;">Click a count to view those records in a new window.</p>';
  html += '</div>';
  html += '<div style="flex:0 0 220px; position:sticky; top:0;"><canvas id="pieChart_capture" width="220" height="220"></canvas></div>';
  html += '</div>';

  /* Failed capture reasons table */
  if (failIssues.length) {
    var totalFailed = totals.failed + unknownRecords.filter(function(r) { return r.outcome === 'failed'; }).length;
    html += '<hr style="margin:14px 0 10px;">';
    html += '<p class="mb-2"><span class="fa fa-exclamation-circle text-danger" style="margin-right:3px;"></span> <strong>' + totalFailed + '</strong> capture failure(s) by error reason:</p>';
    html += '<table class="table table-sm table-bordered table-striped mb-0" style="font-size:93%; max-width:600px;">';
    html += '<thead class="thead-light"><tr><th>Error Issue</th><th style="text-align:center; width:70px;">Count</th></tr></thead><tbody>';

    failIssues.forEach(function(issue) {
      var entry = failIssueMap[issue];
      html += '<tr class="fail-issue-row" style="cursor:pointer;" data-issue="' + issue.replace(/"/g,'&quot;') + '">';
      html += '<td><code style="font-size:12px;">' + issue + '</code></td>';
      html += '<td style="text-align:center;"><span class="font-weight-bold text-danger">' + entry.count + '</span></td>';
      html += '</tr>';
    });

    html += '</tbody></table>';
    html += '<p class="text-muted mt-2 mb-0" style="font-size:85%;">Click a row to view those records in a new window.</p>';
  }

  $('#captureAnalysisContent').html(html);

  renderPieChart({ canvasId: 'pieChart_capture', $container: $('#captureAnalysisContent'), slices: captureSliceData });

  /* Drill-down click handler for known payment sources */
  $('#captureAnalysisContent').on('click', '.capture-drill', function() {
    var src = $(this).data('source');
    var outcome = $(this).data('outcome');
    var recs = sourceMap[src] ? sourceMap[src][outcome + 'Records'] : [];
    if (!recs.length) return;
    var labels = { completed: 'Completed', pending: 'Pending', failed: 'Failed' };
    openFilteredWindow(recs, labels[outcome] + ' Captures: ' + src);
  });

  /* Drill-down click handler for failed issue rows */
  $('#captureAnalysisContent').on('click', '.fail-issue-row', function() {
    var issue = $(this).data('issue');
    var recs = failIssueMap[issue] ? failIssueMap[issue].records : [];
    if (!recs.length) return;
    openFilteredWindow(recs, 'Failed Captures: ' + issue);
  });

  /* Drill-down click handler for fail-also-success link */
  $('#captureAnalysisContent').on('click', '.fail-also-success-drill', function() {
    if (!orderFailSuccessRecords.length) return;
    openFilteredWindow(orderFailSuccessRecords, 'Orders with Failed + Successful Capture');
  });

  /* CSV export handler */
  $('#btnExportCaptureCsv').off('click').on('click', function() {
    var csvRows = [];
    sources.forEach(function(src) {
      var s = sourceMap[src];
      csvRows.push([src, s.completed, s.pending, s.failed, s.total]);
    });
    var headers = ['Payment Source', 'Completed', 'Pending', 'Failed', 'Total'];
    if (failIssues.length) {
      csvRows.push([]);
      csvRows.push(['Error Issue', 'Count']);
      failIssues.forEach(function(issue) {
        csvRows.push([issue, failIssueMap[issue].count]);
      });
    }
    downloadCsv('capture_analysis.csv', headers, csvRows);
  });

  $('#captureAnalysisModal').modal('show');
}

/* ── Drop-off Analysis ── */
function showDropOff() {
  var captureOrderRe = /^\/v2\/checkout\/orders\/([^\/]+)\/capture$/;
  var authorizeOrderRe = /^\/v2\/checkout\/orders\/([^\/]+)\/authorize$/;
  var authCaptureRe = /^\/v2\/payments\/authorizations\/([^\/]+)\/capture$/;

  /* Build lookup: authorization ID → order ID from authorize records */
  var authToOrder = {};
  tableItems.forEach(function(row) {
    var method = ((row.api_request && row.api_request.method) || '').toUpperCase();
    if (method !== 'POST') return;
    var m = (row.url || '').match(authorizeOrderRe);
    if (!m) return;
    var orderId = m[1];
    try {
      var authId = row.api_response.body.purchase_units[0].payments.authorizations[0].id;
      if (authId) authToOrder[authId] = orderId;
    } catch(e) {}
  });

  /* Build per-order capture outcome: best result wins (completed > pending > failed) */
  /* orderOutcome[orderId] = { outcome: 'completed'|'pending'|'failed', records: [...] } */
  var orderOutcome = {};
  /* Build per-order authorize outcome */
  /* orderAuthOutcome[orderId] = { outcome: 'auth_completed'|'auth_declined'|'auth_failed', records: [...] } */
  var orderAuthOutcome = {};

  tableItems.forEach(function(row) {
    var method = ((row.api_request && row.api_request.method) || '').toUpperCase();
    if (method !== 'POST') return;
    var url = row.url || '';

    var orderId = null;
    var captureStatus = null;
    var authStatus = null;
    var isAuth = false;
    var httpStatus = parseInt(row.http_status || (row.api_response && row.api_response.status));

    /* Explicit capture call */
    var m = url.match(captureOrderRe);
    if (m) {
      orderId = m[1];
      try { captureStatus = row.api_response.body.purchase_units[0].payments.captures[0].status; } catch(e) {}
    }

    /* Explicit authorize call */
    if (!orderId) {
      var ma = url.match(authorizeOrderRe);
      if (ma) {
        orderId = ma[1];
        isAuth = true;
        try { authStatus = row.api_response.body.purchase_units[0].payments.authorizations[0].status; } catch(e) {}
      }
    }

    /* Auth-capture: POST /v2/payments/authorizations/{authId}/capture */
    if (!orderId) {
      var mac = url.match(authCaptureRe);
      if (mac) {
        var authId = mac[1];
        orderId = authToOrder[authId] || null;
        captureStatus = (row.api_response && row.api_response.body && row.api_response.body.status) || null;
      }
    }

    /* Inline capture: POST /v2/checkout/orders with captures in response */
    if (!orderId && url === '/v2/checkout/orders') {
      try {
        var cap = row.api_response.body.purchase_units[0].payments.captures[0];
        if (cap) {
          orderId = row.api_response.body.id;
          captureStatus = cap.status;
        }
      } catch(e) {}
    }

    if (!orderId) return;

    if (isAuth) {
      /* Determine authorize outcome */
      var outcome;
      if (httpStatus >= 400) outcome = 'auth_failed';
      else if (authStatus === 'DENIED') outcome = 'auth_declined';
      else if (authStatus) outcome = 'auth_completed';
      else return;

      if (!orderAuthOutcome[orderId]) orderAuthOutcome[orderId] = { outcome: outcome, records: [row] };
      else {
        orderAuthOutcome[orderId].records.push(row);
        /* Upgrade: auth_completed > auth_declined > auth_failed */
        var cur = orderAuthOutcome[orderId].outcome;
        if (outcome === 'auth_completed' || (outcome === 'auth_declined' && cur === 'auth_failed')) {
          orderAuthOutcome[orderId].outcome = outcome;
        }
      }
    } else {
      /* Determine capture outcome */
      var outcome;
      if (httpStatus >= 400) outcome = 'failed';
      else if (captureStatus === 'COMPLETED') outcome = 'completed';
      else if (captureStatus === 'PENDING') outcome = 'pending';
      else if (captureStatus === 'DECLINED' || captureStatus === 'DENIED') outcome = 'failed';
      else return;

      if (!orderOutcome[orderId]) orderOutcome[orderId] = { outcome: outcome, records: [row] };
      else {
        orderOutcome[orderId].records.push(row);
        /* Upgrade outcome: completed > pending > failed */
        var cur = orderOutcome[orderId].outcome;
        if (outcome === 'completed' || (outcome === 'pending' && cur === 'failed')) {
          orderOutcome[orderId].outcome = outcome;
        }
      }
    }
  });

  /* Scan order creations and classify each */
  var totalCreates = 0;
  var buckets = {
    completed:      { count: 0, orders: [] },
    pending:        { count: 0, orders: [] },
    failed:         { count: 0, orders: [] },
    auth_completed: { count: 0, orders: [] },
    auth_declined:  { count: 0, orders: [] },
    auth_failed:    { count: 0, orders: [] },
    none:           { count: 0, orders: [] }
  };

  tableItems.forEach(function(row) {
    var method = ((row.api_request && row.api_request.method) || '').toUpperCase();
    if (method !== 'POST') return;
    if (row.url !== '/v2/checkout/orders') return;

    var httpStatus = parseInt(row.http_status || (row.api_response && row.api_response.status));
    if (httpStatus < 200 || httpStatus >= 300) return;

    totalCreates++;

    var orderId = null;
    try { orderId = row.api_response.body.id; } catch(e) {}

    /* Cumulative funnel: count an order in every stage it reached */
    var classified = false;
    if (orderId && orderOutcome[orderId]) {
      var bucket = orderOutcome[orderId].outcome;
      buckets[bucket].count++;
      buckets[bucket].orders.push(row);
      classified = true;
    }
    if (orderId && orderAuthOutcome[orderId]) {
      var bucket = orderAuthOutcome[orderId].outcome;
      buckets[bucket].count++;
      buckets[bucket].orders.push(row);
      classified = true;
    }
    if (!classified) {
      buckets.none.count++;
      buckets.none.orders.push(row);
    }
  });

  var html = '';
  if (!totalCreates) {
    html = '<div class="alert alert-success mb-0">No <code>POST /v2/checkout/orders</code> requests found in the loaded data.</div>';
    $('#dropOffContent').html(html);
    $('#dropOffModal').modal('show');
    return;
  }

  function pct(n) { return ((n / totalCreates) * 100).toFixed(1); }
  function drillLink(count, id, color) {
    if (!count) return '<strong class="text-muted">0</strong>';
    return '<a href="javascript:void(0);" class="dropoff-drill font-weight-bold" data-bucket="' + id + '" style="color:' + color + '; text-decoration:none;">' + count + '</a>';
  }

  /* Semantic colors for drop-off slices */
  var dropoffSemanticColors = {
    completed: '#28a745', pending: '#e6a800', failed: '#dc3545',
    auth_completed: '#17a2b8', auth_declined: '#fd7e14', auth_failed: '#6f42c1',
    none: '#6c757d'
  };
  var dropoffSliceData = [];
  var dropoffSliceMeta = [
    { key: 'completed', label: 'Capture completed', icon: '<span class="fa fa-check text-success"></span>' },
    { key: 'pending', label: 'Capture pending', icon: '<span class="fa fa-clock-o" style="color:#e6a800;"></span>' },
    { key: 'failed', label: 'Capture failed', icon: '<span class="fa fa-times text-danger"></span>' },
    { key: 'auth_completed', label: 'Authorize completed', icon: '<span class="fa fa-lock" style="color:#17a2b8;"></span>' },
    { key: 'auth_declined', label: 'Authorize declined', icon: '<span class="fa fa-ban" style="color:#fd7e14;"></span>' },
    { key: 'auth_failed', label: 'Authorize failed', icon: '<span class="fa fa-times" style="color:#6f42c1;"></span>' },
    { key: 'none', label: 'Drop-off (no capture/authorize)', icon: '<span class="fa fa-sign-out" style="color:#6c757d;"></span>' }
  ];

  html += '<p class="mb-3">Of <strong>' + totalCreates + '</strong> successful order creation(s) (<code>POST /v2/checkout/orders</code> &rarr; 2xx), cumulative funnel &mdash; an order may count in multiple stages:</p>';
  html += '<div style="display:flex; gap:20px; align-items:flex-start;">';
  html += '<div style="flex:1; min-width:0;">';
  html += '<table class="table table-sm table-bordered mb-0" style="font-size:93%;">';
  html += '<tbody>';

  var dropoffSliceIdx = 0;
  dropoffSliceMeta.forEach(function(meta) {
    var count = buckets[meta.key].count;
    var semColor = dropoffSemanticColors[meta.key];
    if (count > 0) {
      dropoffSliceData.push({ label: meta.label, value: count, color: semColor });
      html += '<tr data-slice-index="' + dropoffSliceIdx + '">';
      html += '<td><span style="display:inline-block;width:10px;height:10px;background:' + semColor + ';margin-right:5px;vertical-align:middle;border-radius:1px;"></span>' + meta.icon + ' ' + meta.label + '</td>';
      html += '<td style="text-align:center; width:130px;">' + drillLink(count, meta.key, semColor) + ' <span class="text-muted" style="font-size:80%;">' + pct(count) + '%</span></td></tr>';
      dropoffSliceIdx++;
    } else {
      html += '<tr>';
      html += '<td><span style="display:inline-block;width:10px;height:10px;background:' + semColor + ';margin-right:5px;vertical-align:middle;border-radius:1px;opacity:0.3;"></span>' + meta.icon + ' ' + meta.label + '</td>';
      html += '<td style="text-align:center; width:130px;"><strong class="text-muted">0</strong> <span class="text-muted" style="font-size:80%;">' + pct(0) + '%</span></td></tr>';
    }
  });

  html += '</tbody></table>';
  html += '<p class="text-muted mt-2 mb-0" style="font-size:85%;">Click a count to view those order creation records in a new window.</p>';
  html += '</div>';
  html += '<div style="flex:0 0 220px; position:sticky; top:0;"><canvas id="pieChart_dropoff" width="220" height="220"></canvas></div>';
  html += '</div>';

  $('#dropOffContent').html(html);

  renderPieChart({ canvasId: 'pieChart_dropoff', $container: $('#dropOffContent'), slices: dropoffSliceData });

  $('#dropOffContent').on('click', '.dropoff-drill', function() {
    var bucket = $(this).data('bucket');
    var recs = buckets[bucket] ? buckets[bucket].orders : [];
    if (!recs.length) return;
    var labels = {
      completed: 'Capture Completed', pending: 'Capture Pending', failed: 'Capture Failed',
      auth_completed: 'Authorize Completed', auth_declined: 'Authorize Declined', auth_failed: 'Authorize Failed',
      none: 'Drop-off (No Capture/Authorize)'
    };
    openFilteredWindow(recs, 'Orders: ' + labels[bucket]);
  });

  $('#dropOffModal').modal('show');
}

/* ── External URLs ── */
function showExternalUrls() {
  var paypalRe = /\.paypal\.com|\.paypalinc\.com|\.braintreegateway\.com|\.braintree-api\.com/i;
  var urlRe = /https?:\/\/[^\s"'<>,;}\]]+/gi;
  var urlFieldRe = /_(url|uri)$/i;

  /* Recursively extract all URL strings from an object */
  function extractUrls(obj, key) {
    var urls = [];
    if (!obj || typeof obj !== 'object') {
      if (typeof obj === 'string') {
        var matches = obj.match(urlRe);
        if (matches) urls = urls.concat(matches);
        /* Also capture bare URLs from fields named *_url / *_uri */
        if (key && urlFieldRe.test(key) && !matches && obj.length > 1) {
          urls.push(obj);
        }
      }
      return urls;
    }
    if (Array.isArray(obj)) {
      obj.forEach(function(item) { urls = urls.concat(extractUrls(item, key)); });
    } else {
      Object.keys(obj).forEach(function(k) { urls = urls.concat(extractUrls(obj[k], k)); });
    }
    return urls;
  }

  /* Find the field name path for a URL value */
  function findFieldNames(obj, targetUrl, prefix) {
    var names = [];
    if (!obj || typeof obj !== 'object') return names;
    if (Array.isArray(obj)) {
      obj.forEach(function(item, i) {
        names = names.concat(findFieldNames(item, targetUrl, prefix + '[' + i + ']'));
      });
    } else {
      Object.keys(obj).forEach(function(key) {
        var val = obj[key];
        if (typeof val === 'string' && val.indexOf(targetUrl) !== -1) {
          names.push(key);
        } else if (typeof val === 'object' && val !== null) {
          names = names.concat(findFieldNames(val, targetUrl, prefix ? prefix + '.' + key : key));
        }
      });
    }
    return names;
  }

  /* Extract hostname from a URL that may lack a protocol */
  function extractHost(u) {
    try { var h = new URL(u).hostname; if (h) return h; } catch(e) {}
    try { var h2 = new URL('https://' + u).hostname; if (h2) return h2; } catch(e) {}
    return '(invalid)';
  }

  /* urlMap: { url -> { count, fieldNames: Set, records: [] } } */
  var urlMap = {};

  tableItems.forEach(function(row) {
    var reqUrls = extractUrls(row.api_request ? row.api_request.body : null);
    var resUrls = extractUrls(row.api_response ? row.api_response.body : null);
    var allUrls = reqUrls.concat(resUrls);

    /* Deduplicate URLs within this single record */
    var seen = {};
    allUrls.forEach(function(u) {
      /* Clean trailing punctuation artifacts */
      u = u.replace(/[)}\]]+$/, '');
      if (paypalRe.test(u)) return;
      if (seen[u]) return;
      seen[u] = true;

      if (!urlMap[u]) urlMap[u] = { count: 0, fieldNames: {}, records: [] };
      urlMap[u].count++;
      urlMap[u].records.push(row);

      /* Determine which field(s) held this URL */
      var reqFields = findFieldNames(row.api_request ? row.api_request.body : null, u, '');
      var resFields = findFieldNames(row.api_response ? row.api_response.body : null, u, '');
      reqFields.concat(resFields).forEach(function(f) { urlMap[u].fieldNames[f] = true; });
    });
  });

  var urls = Object.keys(urlMap).sort(function(a, b) {
    return urlMap[b].count - urlMap[a].count;
  });

  if (!urls.length) {
    $('#externalUrlsContent').html('<div class="alert alert-success mb-0">No external (non-PayPal) URLs found in the loaded data.</div>');
    $('#externalUrlsModal').modal('show');
    return;
  }

  /* Group by hostname (protocol-agnostic) for domain view */
  var domainMap = {};  /* hostname -> { count, records: [], fieldNames: {} } */
  urls.forEach(function(u) {
    var host;
    host = extractHost(u);
    if (!domainMap[host]) domainMap[host] = { count: 0, records: [], fieldNames: {} };
    domainMap[host].count += urlMap[u].count;
    /* Merge records (deduplicate by correlation_id) */
    urlMap[u].records.forEach(function(r) {
      var already = domainMap[host].records.some(function(existing) {
        return existing.correlation_id && existing.correlation_id === r.correlation_id;
      });
      if (!already) domainMap[host].records.push(r);
    });
    /* Merge field names */
    Object.keys(urlMap[u].fieldNames).forEach(function(f) { domainMap[host].fieldNames[f] = true; });
  });
  var domains = Object.keys(domainMap).sort(function(a, b) { return domainMap[b].count - domainMap[a].count; });

  var totalRefs = 0;
  urls.forEach(function(u) { totalRefs += urlMap[u].count; });

  /* --- render functions for each view --- */
  function renderByUrl() {
    /* Pie slices by hostname */
    var hostCounts = {};
    urls.forEach(function(u) {
      var host;
      host = extractHost(u);
      hostCounts[host] = (hostCounts[host] || 0) + urlMap[u].count;
    });
    var hostsSorted = Object.keys(hostCounts).sort(function(a, b) { return hostCounts[b] - hostCounts[a]; });
    var sliceData = [];
    hostsSorted.forEach(function(host, idx) {
      sliceData.push({ label: host, value: hostCounts[host], color: PIE_COLORS[idx % PIE_COLORS.length] });
    });
    var hostSliceIndex = {};
    hostsSorted.forEach(function(host, idx) { hostSliceIndex[host] = idx; });

    var html = '<p class="mb-2"><strong>' + urls.length + '</strong> distinct external URL(s) across <strong>' + totalRefs + '</strong> reference(s):</p>';
    html += '<div style="display:flex; gap:20px; align-items:flex-start;">';
    html += '<div style="flex:1; min-width:0; overflow:auto; max-height:calc(100vh - 350px);">';
    html += '<table class="table table-sm table-bordered table-striped mb-0" style="font-size:93%;">';
    html += '<thead class="thead-light"><tr><th>URL</th><th style="width:130px;">Field(s)</th><th style="width:70px; text-align:center;">Count</th></tr></thead><tbody>';

    urls.forEach(function(u, idx) {
      var entry = urlMap[u];
      var fields = Object.keys(entry.fieldNames);
      var fieldHtml = fields.map(function(f) { return '<code style="font-size:11px;">' + f + '</code>'; }).join(', ') || '<span class="text-muted">-</span>';
      var host;
      host = extractHost(u);
      var sliceIdx = hostSliceIndex[host] !== undefined ? hostSliceIndex[host] : 0;
      var sliceColor = PIE_COLORS[sliceIdx % PIE_COLORS.length];

      html += '<tr class="exturl-row" style="cursor:pointer;" data-url-index="' + idx + '" data-slice-index="' + sliceIdx + '">';
      html += '<td><span style="display:inline-block;width:10px;height:10px;background:' + sliceColor + ';margin-right:5px;vertical-align:middle;border-radius:1px;"></span><span style="font-size:12px; word-break:break-all;">' + u.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span></td>';
      html += '<td>' + fieldHtml + '</td>';
      html += '<td style="text-align:center;"><span class="font-weight-bold">' + entry.count + '</span></td>';
      html += '</tr>';
    });

    html += '</tbody></table>';
    html += '<p class="text-muted mt-2 mb-0" style="font-size:85%;">Click a row to view those API history records in a new window.</p>';
    html += '</div>';
    html += '<div style="flex:0 0 220px; position:sticky; top:0;"><canvas id="pieChart_exturls" width="220" height="220"></canvas></div>';
    html += '</div>';

    $('#exturlTableArea').html(html);
    renderPieChart({ canvasId: 'pieChart_exturls', $container: $('#exturlTableArea'), slices: sliceData });

    $('#exturlTableArea').off('click', '.exturl-row').on('click', '.exturl-row', function() {
      var urlIdx = $(this).data('url-index');
      var u = urls[urlIdx];
      var recs = urlMap[u] ? urlMap[u].records : [];
      if (!recs.length) return;
      var displayUrl = u.length > 60 ? u.slice(0, 50) + '...' : u;
      openFilteredWindow(recs, 'External URL: ' + displayUrl);
    });
  }

  function renderByDomain() {
    var sliceData = [];
    domains.forEach(function(host, idx) {
      sliceData.push({ label: host, value: domainMap[host].count, color: PIE_COLORS[idx % PIE_COLORS.length] });
    });

    var html = '<p class="mb-2"><strong>' + domains.length + '</strong> distinct domain(s) across <strong>' + totalRefs + '</strong> reference(s):</p>';
    html += '<div style="display:flex; gap:20px; align-items:flex-start;">';
    html += '<div style="flex:1; min-width:0; overflow:auto; max-height:calc(100vh - 350px);">';
    html += '<table class="table table-sm table-bordered table-striped mb-0" style="font-size:93%;">';
    html += '<thead class="thead-light"><tr><th>Domain</th><th style="width:130px;">Field(s)</th><th style="width:90px; text-align:center;">Requests</th><th style="width:70px; text-align:center;">Refs</th></tr></thead><tbody>';

    domains.forEach(function(host, idx) {
      var entry = domainMap[host];
      var fields = Object.keys(entry.fieldNames);
      var fieldHtml = fields.map(function(f) { return '<code style="font-size:11px;">' + f + '</code>'; }).join(', ') || '<span class="text-muted">-</span>';
      var sliceColor = PIE_COLORS[idx % PIE_COLORS.length];

      html += '<tr class="extdomain-row" style="cursor:pointer;" data-domain-index="' + idx + '" data-slice-index="' + idx + '">';
      html += '<td><span style="display:inline-block;width:10px;height:10px;background:' + sliceColor + ';margin-right:5px;vertical-align:middle;border-radius:1px;"></span><span style="font-size:12px; word-break:break-all;">' + host.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span></td>';
      html += '<td>' + fieldHtml + '</td>';
      html += '<td style="text-align:center;"><span class="font-weight-bold">' + entry.records.length + '</span></td>';
      html += '<td style="text-align:center;"><span class="font-weight-bold">' + entry.count + '</span></td>';
      html += '</tr>';
    });

    html += '</tbody></table>';
    html += '<p class="text-muted mt-2 mb-0" style="font-size:85%;">Click a row to view those API history records in a new window.</p>';
    html += '</div>';
    html += '<div style="flex:0 0 220px; position:sticky; top:0;"><canvas id="pieChart_exturls" width="220" height="220"></canvas></div>';
    html += '</div>';

    $('#exturlTableArea').html(html);
    renderPieChart({ canvasId: 'pieChart_exturls', $container: $('#exturlTableArea'), slices: sliceData });

    $('#exturlTableArea').off('click', '.extdomain-row').on('click', '.extdomain-row', function() {
      var domIdx = $(this).data('domain-index');
      var host = domains[domIdx];
      var recs = domainMap[host] ? domainMap[host].records : [];
      if (!recs.length) return;
      openFilteredWindow(recs, 'Domain: ' + host);
    });
  }

  /* --- Build outer shell with toggle --- */
  var shell = '<div class="btn-group btn-group-toggle mb-2" data-toggle="buttons">';
  shell += '<label class="btn btn-sm btn-outline-secondary active" id="extViewDomain"><input type="radio" name="exturlView" autocomplete="off" checked> By Domain</label>';
  shell += '<label class="btn btn-sm btn-outline-secondary" id="extViewUrl"><input type="radio" name="exturlView" autocomplete="off"> By URL</label>';
  shell += '</div>';
  shell += '<div id="exturlTableArea"></div>';

  $('#externalUrlsContent').html(shell);

  /* Toggle handlers */
  $('#extViewDomain').on('click', function() { renderByDomain(); });
  $('#extViewUrl').on('click', function() { renderByUrl(); });

  /* Default view */
  renderByDomain();

  /* CSV export handler */
  $('#btnExportExternalCsv').off('click').on('click', function() {
    var isDomainView = $('#extViewDomain').hasClass('active');
    var csvRows = [];
    if (isDomainView) {
      domains.forEach(function(host) {
        var entry = domainMap[host];
        var fields = Object.keys(entry.fieldNames).join(', ');
        csvRows.push([host, fields, entry.records.length, entry.count]);
      });
      downloadCsv('external_urls_by_domain.csv', ['Domain', 'Fields', 'Requests', 'Refs'], csvRows);
    } else {
      urls.forEach(function(u) {
        var entry = urlMap[u];
        var fields = Object.keys(entry.fieldNames).join(', ');
        csvRows.push([u, fields, entry.count]);
      });
      downloadCsv('external_urls_by_url.csv', ['URL', 'Fields', 'Count'], csvRows);
    }
  });

  $('#externalUrlsModal').modal('show');
}

/* ── Load data from file picker ── */
function loadAndRender(allData) {
  if (!allData || !allData.length) {
    $('#file-error').text('No records found in the selected file(s).').show();
    return;
  }
  $('#file-picker').hide();
  $('#file-error').hide();
  $('#tools-bar').show();
  allData.sort(function(a, b) { return new Date(b.create_time).getTime() - new Date(a.create_time).getTime(); });

  /* Deduplicate by correlation_id */
  var before = allData.length;
  var seen = {};
  allData = allData.filter(function(row) {
    var cid = row.correlation_id;
    if (!cid || cid === 'xxxxxx') return true;
    if (seen[cid]) return false;
    seen[cid] = true;
    return true;
  });
  var dupes = before - allData.length;
  if (dupes) console.log('Deduplicated: removed ' + dupes + ' duplicate(s) by correlation_id');

  /* Auto-detect environment from data URLs */
  apiHistoryEnv = 'live';
  for (var j = 0; j < Math.min(allData.length, 20); j++) {
    if (JSON.stringify(allData[j]).indexOf('api-m.sandbox.paypal.com') !== -1) {
      apiHistoryEnv = 'sandbox';
      break;
    }
  }
  var envLabel = apiHistoryEnv === 'sandbox' ? 'Sandbox' : 'Live';
  var envColor = apiHistoryEnv === 'sandbox' ? '#e6a800' : '#28a745';
  $('#env-badge').html('<span class="badge" style="background-color:' + envColor + '; color:#fff;">' + envLabel + '</span>').show();

  allLoadedData = allData;
  document.title = allLoadedData.length + ' events - Local REST API Explorer';
  applyExclusions();
}

$(document).ready(function() {
  $('#btnErrorAnalysis').on('click', showErrorAnalysis);
  $('#btnEndpointCount').on('click', showEndpointCount);
  $('#btnClientIds').on('click', showClientIds);
  $('#btnCaptureAnalysis').on('click', showCaptureAnalysis);
  $('#btnDropOff').on('click', showDropOff);
  $('#btnExternalUrls').on('click', showExternalUrls);

  /* Exclude filter events */
  $('#exclude-add-btn').on('click', function() {
    addExcludePattern($('#exclude-input').val());
    $('#exclude-input').val('');
  });
  $('#exclude-input').on('keydown', function(e) {
    if (e.key === 'Enter') {
      addExcludePattern($(this).val());
      $(this).val('');
    }
  });
  $(document).on('click', '.exclude-pill-remove', function() {
    removeExcludePattern(parseInt($(this).data('index')));
  });
  $(document).on('change', '.exclude-pill-check', function() {
    toggleExcludePattern(parseInt($(this).data('index')));
  });
  $(document).on('click', '#exclude-clear-all', function() {
    clearAllExclusions();
  });

  $('#dataFileInput').on('change', function(e) {
    var files = e.target.files;
    if (!files.length) return;

    /* Update label with file names */
    var names = [];
    for (var i = 0; i < files.length; i++) names.push(files[i].name);
    $(this).next('.custom-file-label').text(names.join(', '));

    var allData = [];
    var loaded = 0;
    var errorOccurred = false;

    for (var i = 0; i < files.length; i++) {
      (function(file) {
        var reader = new FileReader();
        reader.onload = function(ev) {
          if (errorOccurred) return;
          try {
            var parsed = JSON.parse(ev.target.result);
            if (Array.isArray(parsed)) {
              allData = allData.concat(parsed);
            } else {
              throw new Error('File content is not a JSON array');
            }
          } catch (err) {
            errorOccurred = true;
            $('#file-error').text('Error parsing "' + file.name + '": ' + err.message).show();
            return;
          }
          loaded++;
          if (loaded === files.length) {
            loadAndRender(allData);
          }
        };
        reader.onerror = function() {
          errorOccurred = true;
          $('#file-error').text('Error reading file: ' + file.name).show();
        };
        reader.readAsText(file);
      })(files[i]);
    }
  });
});
</script>
